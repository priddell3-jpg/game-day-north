<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Which of your teams are playing, and which Canadian service each game is on.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Game Day North">
<meta property="og:description" content="Multi-team game tracker for Canada — fixtures, where to watch, and scores you can hide.">
</head>
<body>
<title>Game Day North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F8;
  --surface:#FFFFFF;
  --surface-2:#F7F8FC;
  --ink:#0C1120;
  --ink-2:#2A3346;
  --muted:#68738C;
  --line:#DCE2EE;
  --line-strong:#C3CBDC;
  --accent:#1F3BE0;
  --accent-soft:#E5E9FD;
  --live:#DC1B33;
  --live-soft:#FCE7EA;
  --panel:#0C1120;
  --panel-ink:#EEF1F8;
  --panel-muted:#7C88A3;
  --panel-line:#232C42;
  --shadow:0 1px 2px rgba(12,17,32,.06), 0 8px 24px -16px rgba(12,17,32,.28);
  --radius:10px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080B14;
    --surface:#121828;
    --surface-2:#0E1421;
    --ink:#E8ECF7;
    --ink-2:#C3CBDC;
    --muted:#8590A9;
    --line:#212A3D;
    --line-strong:#2E3950;
    --accent:#7B90FF;
    --accent-soft:#1A2247;
    --live:#FF5E72;
    --live-soft:#3A1520;
    --panel:#03060E;
    --panel-ink:#E8ECF7;
    --panel-muted:#78849E;
    --panel-line:#1A2233;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#080B14;
  --surface:#121828;
  --surface-2:#0E1421;
  --ink:#E8ECF7;
  --ink-2:#C3CBDC;
  --muted:#8590A9;
  --line:#212A3D;
  --line-strong:#2E3950;
  --accent:#7B90FF;
  --accent-soft:#1A2247;
  --live:#FF5E72;
  --live-soft:#3A1520;
  --panel:#03060E;
  --panel-ink:#E8ECF7;
  --panel-muted:#78849E;
  --panel-line:#1A2233;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--display);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{
  width:28px;height:28px;flex:none;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-family:var(--mono);
  font-size:12px;font-weight:600;letter-spacing:-.5px;
}
.brand-name{font-weight:800;font-stretch:118%;letter-spacing:-.2px;font-size:16px;white-space:nowrap;margin:0}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,background .15s;
}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.eye{width:15px;height:15px;flex:none}

/* ---------- scoreboard rail ---------- */
.rail{background:var(--panel);color:var(--panel-ink);border-bottom:1px solid var(--line-strong);box-shadow:inset 0 -1px 0 var(--panel-line)}
.rail-in{display:flex;align-items:stretch;gap:0;min-height:64px}
.rail-label{
  flex:none;display:flex;flex-direction:column;justify-content:center;padding:10px 18px 10px 0;
  border-right:1px solid var(--panel-line);margin-right:16px;
}
.rail-label b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--panel-muted);font-weight:500}
.rail-label span{font-weight:800;font-stretch:118%;font-size:15px;letter-spacing:-.2px}
.rail-scroll{display:flex;gap:0;overflow-x:auto;flex:1;scrollbar-width:thin}
.rail-card{
  flex:none;min-width:186px;padding:11px 18px 11px 0;margin-right:18px;
  border-right:1px solid var(--panel-line);display:flex;flex-direction:column;gap:3px;justify-content:center;
}
.rail-card:last-child{border-right:none}
.rail-row{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12.5px}
.rail-row .t{flex:1;color:var(--panel-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-row .s{font-weight:600;font-variant-numeric:tabular-nums}
.rail-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-muted);display:flex;gap:7px;align-items:center}
.rail-empty{display:block;color:var(--panel-muted);font-size:13.5px;line-height:1.55;padding:12px 0}
.rail-empty .countdown{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.rail-empty b{white-space:normal}
.rail-empty b{color:var(--panel-ink);font-weight:700}

/* ---------- live dot ---------- */
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}

/* ---------- teams drawer ---------- */
.drawer{border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-in{padding:18px 0 20px}
.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.drawer-head h2{margin:0;font-size:14px;font-weight:800;font-stretch:118%;letter-spacing:-.1px}
.drawer-head .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
.search{
  margin-left:auto;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  font:inherit;font-size:13px;color:var(--ink);min-width:180px;
}
.search::placeholder{color:var(--muted)}
.lg-group{margin-bottom:14px}
.lg-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lg-title b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lg-title .bar{height:1px;flex:1;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,background .15s,color .15s;
}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.crest{
  width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:8.5px;font-weight:600;color:#fff;letter-spacing:-.3px;
}

/* ---------- day sections ---------- */
main{padding:22px 0 80px}
.day{margin-bottom:26px}
.day-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.day-head h3{margin:0;font-size:17px;font-weight:800;font-stretch:120%;letter-spacing:-.3px;text-transform:uppercase}
.day-head .rel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.day-head .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- game row ---------- */
.game{
  display:grid;
  grid-template-columns:74px 1fr auto auto 34px;
  gap:16px;align-items:center;
  padding:13px 14px 13px 12px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  border-left:3px solid transparent;
  transition:background .15s;
}
.day-games{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;background:var(--surface)}
.game:last-child{border-bottom:none}
.game:hover{background:var(--surface-2)}
.game.is-live{border-left-color:var(--live);background:linear-gradient(90deg,var(--live-soft),var(--surface) 55%)}
.g-time{font-family:var(--mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.g-time .ap{font-size:10px;color:var(--muted);margin-left:2px}
.g-time .moved{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--live);margin-top:2px}
.g-time .was{display:block;font-size:10px;color:var(--muted);text-decoration:line-through}
.g-match{min-width:0;display:flex;flex-direction:column;gap:4px}
.g-team{min-width:0}
.g-teams{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g-team{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;letter-spacing:-.15px;white-space:nowrap}
.g-team.dim{font-weight:500;color:var(--ink-2)}
.at{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* tennis: two players, a separator that is not "at", and a score that
   stays a list of sets rather than collapsing into two numbers */
.vs{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.g-team.pl-win{color:var(--ink)}
.g-team.tbd-slot{font-weight:500;color:var(--muted);font-style:italic}
/* The country code sits inside .g-team, which is allowed to break
   anywhere at the narrow breakpoint so a long name cannot overflow. A
   three-letter code is not a word to break: without this it stacks one
   letter per line at 320. */
.pl-flag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow-wrap:normal}
.sets{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.set{white-space:nowrap}
.g-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.lg-tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;padding:2px 6px;border-radius:4px;color:#fff}
.g-watch{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.svc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.svc .pip{width:5px;height:5px;border-radius:1px;background:var(--muted);flex:none}
.svc.tv .pip{background:var(--accent);border-radius:1px}
.svc.stream .pip{background:var(--ink-2);border-radius:50%}
.svc-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-score{min-width:88px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.score-line{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.score-state{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.score-state.live{color:var(--live);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.hidden-score{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px dashed var(--line-strong);border-radius:6px;padding:4px 9px;color:var(--muted);
  transition:border-color .15s,color .15s;
}
.hidden-score:hover{border-color:var(--accent);color:var(--accent)}
.podium{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.conf-note.leader{color:var(--accent)}
.stale-h{color:var(--warn)}
.countdown{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bell{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}
.bell:hover{background:var(--surface-2);border-color:var(--line)}
.bell[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.bell svg{width:15px;height:15px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;font-weight:800;font-stretch:115%;color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head h3{margin:0;font-size:19px;font-weight:800;font-stretch:120%;letter-spacing:-.4px;text-transform:uppercase}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-strong)}
.cal-legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:var(--surface-2);padding:7px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.cal-cell{background:var(--surface);min-height:96px;min-width:0;overflow:hidden;padding:6px 7px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;border:none;border-radius:0}
.cal-cell.out{background:var(--surface-2);color:var(--muted)}
.cal-cell:hover{background:var(--accent-soft)}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.cal-num{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;align-items:center;gap:5px}
.cal-cell.today .cal-num b{background:var(--live);color:#fff;border-radius:4px;padding:0 4px}
.cal-num b{font-weight:600;color:var(--ink)}
.cal-cell.out .cal-num b{color:var(--muted)}
.cal-ev{display:flex;align-items:center;gap:5px;min-width:0;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.cal-ev .mu{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cal-ev i{width:6px;height:6px;border-radius:50%;flex:none}
.cal-ev .tm{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:9.5px}
.cal-more{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:auto}
.cal-detail{margin-top:20px}
.cal-detail .day-head{border-bottom-width:2px}

/* ---------- footer note ---------- */
.note{
  margin-top:26px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);background:var(--surface);font-size:13px;color:var(--ink-2);
}
.note b{font-weight:800;font-stretch:112%}
.note code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .brand-sub{display:none}
  .topbar-in{height:auto;padding:10px 0;flex-wrap:wrap;gap:8px}
  .game{grid-template-columns:64px 1fr auto;gap:10px;padding:12px 8px 12px 10px}
  .g-watch{grid-column:2/3;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:10px}
  .g-score{grid-column:3;grid-row:1;min-width:0}
  /* Saving a game was unreachable on a phone. It sits beside the watch
     row now, at a size a thumb can actually hit. */
  .bell{grid-column:3;grid-row:2;justify-self:end;align-self:center;width:44px;height:44px}
  .bell svg{width:18px;height:18px}
  .cal-cell{min-height:70px}
  .cal-ev .tm{display:none}
  .rail-label{display:none}
}

/* ---------- v2: coverage, confidence, competitions ---------- */
:root{ --ok:#0F7A52; --ok-soft:#E3F3EC; --warn:#9A5B00; --warn-soft:#FBF0DC; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ok:#4FD1A0; --ok-soft:#0E2C22; --warn:#E8B45E; --warn-soft:#2E2210; } }
:root[data-theme="dark"]{ --ok:#4FD1A0; --ok-soft:#0E2C22; --warn:#E8B45E; --warn-soft:#2E2210; }

.welcome{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;margin:18px 0 4px;
  border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius)}
.welcome b{display:block;font-size:14px;font-weight:800;font-stretch:115%;margin-bottom:2px}
.welcome p{margin:0;font-size:13px;color:var(--ink-2);max-width:62ch}
.welcome .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.welcome .x{color:var(--muted);font-size:16px;line-height:1;padding:4px 6px}
@media (max-width:760px){ .welcome{flex-wrap:wrap} .welcome .acts{margin-left:0;width:100%} }

/* At 320px the middle column is about 100px, and a long club name is
   wider than that. white-space:nowrap meant the name could not shrink to
   its column, so it painted across the score beside it — "Toronto Blue
   Jays" over "FIRST PITCH". Letting it wrap keeps the whole name visible
   rather than truncating it, and overflow-wrap:anywhere lets a single
   long word break too, which is what actually caps the element's
   min-content width and makes overflow impossible rather than merely
   unlikely. Reclaiming a few pixels of gap gives the name more room
   without narrowing the score column, which has to stay legible. */
@media (max-width:360px){
  .game{gap:8px;padding:12px 6px 12px 8px}
  .g-team{white-space:normal;overflow-wrap:anywhere}
  .g-teams{gap:6px}
  /* a player's name gets the same freedom to wrap as a club's, so a long
     one cannot paint into the score column at 320 */
  .sets{gap:3px;font-size:11px}
}

.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 4px}
.filters .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.fchip i{width:7px;height:7px;border-radius:50%;flex:none;opacity:.35}
.fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--line-strong)}
.fchip[aria-pressed="true"] i{opacity:1}

.coverage{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:22px}
.coverage summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.coverage summary::-webkit-details-marker{display:none}
.coverage summary::after{content:"\25BE";margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s;padding-left:10px}
.coverage[open] summary::after{transform:rotate(180deg)}
.cov-h{display:block;font-size:15px;font-weight:800;font-stretch:118%;letter-spacing:-.2px;margin-bottom:3px}
.coverage .sub{display:block;font-size:12.5px;color:var(--muted)}

/* ============================================================
   SERVICES — carriers roll up to the subscription you'd buy.
   Sportsnet Pacific / One / + are all "a Sportsnet sub".
   ============================================================ */
const SERVICES = {
  sportsnet:{label:"Sportsnet", kind:"tv"},
  tsn:      {label:"TSN",       kind:"tv"},
  rds:      {label:"RDS",       kind:"tv"},
  tva:      {label:"TVA Sports",kind:"tv"},
  ctv:      {label:"CTV",       kind:"tv"},

  fubo:     {label:"Fubo",      kind:"stream"},
  dazn:     {label:"DAZN",      kind:"stream"},

  mlbtv:    {label:"MLB.TV",    kind:"stream"},
  nbalp:    {label:"NBA League Pass", kind:"stream"},
  flobikes: {label:"FloBikes",  kind:"stream"}
};
const CARRIER_SERVICE = {
  "Sportsnet":"sportsnet","Sportsnet One":"sportsnet","Sportsnet Pacific":"sportsnet",
  "Sportsnet West":"sportsnet","Sportsnet Ontario":"sportsnet","Sportsnet+":"sportsnet",
  "TSN":"tsn","TSN3":"tsn","TSN4":"tsn","TSN5":"tsn","TSN+":"tsn",
  "RDS":"rds","TVA Sports":"tva","CTV":"ctv","CTV2":"ctv",
  "Prime Video":"prime","Fubo Canada":"fubo","DAZN Canada":"dazn",
  "MLS Season Pass":"apple","MLB.TV":"mlbtv","NBA League Pass":"nbalp","FloBikes":"flobikes"
};

/* ============================================================
   RIGHTS TABLE — ordered rules, first match wins.
   Every row carries its confidence and its source, so a listing
   can say how much it should be trusted. Editing a rights change
   is a data edit here, not a code change.
   ============================================================ */
const CHECKED = "2026-08-22";
const SRC = {
  fubo:    {label:"Fubo press release", url:"https://www.businesswire.com/news/home/20250417021019/en/Fubo-Retains-Exclusive-Rights-to-Premier-League-in-Canada-With-Multi-Year-Agreement-Beginning-With-20252026-Season"},
  dazn:    {label:"DAZN press room", url:"https://dazngroup.com/press-room/dazn-canada-retains-exclusive-rights-to-uefa-club-competitions/"},

  rogers:  {label:"Rogers / Prime Video", url:"https://about.rogers.com/news-ideas/rogers-and-prime-video-announce-12-year-sublicensing-agreement-for-nhl-rights-in-canada/"},
  cbc:     {label:"CBC sublicence ended", url:"https://www.sportsvideo.org/2026/06/16/nhl-games-leaving-cbc-in-canada-as-sublicense-rogers-sportsnet-ends/"},

  raptors: {label:"Rogers–MLSE: TSN/Sportsnet split holds", url:"https://www.si.com/nba/raptors/changes-for-toronto-raptors-fans-after-rogers-purchase-of-mlse"},
  jays:    {label:"Sportsnet+ carries the MLB postseason", url:"https://www.sportsmediawatch.com/tv-schedules/mlb-tv-schedule/toronto-blue-jays/"},
  flo:     {label:"Escape Collective — how to watch 2026", url:"https://escapecollective.com/how-to-watch-pro-bike-racing-in-2026/"},
  pcs:     {label:"ProCyclingStats — 2026 WorldTour calendar", url:"https://www.procyclingstats.com/races.php?year=2026&circuit=1"},
  atptv:   {label:"ATP Tour — Watch Live, broadcaster list", url:"https://www.atptour.com/en/video/watch-live"},
  usopen:  {label:"US Open — international broadcasters", url:"https://www.usopen.org/en_US/about/tv_intl.html"},
  none:    {label:"No Canadian rights holder found", url:""}
};
const tv = n => ({name:n, kind:"tv"});
const st = n => ({name:n, kind:"stream"});
const CDN_MLS = ["van-mls","tfc","mtl-mls"];

/* Tennis rights attach to a tournament, never to a player. Following
   Alcaraz tells you nothing about who shows his matches; the tournament
   he is playing decides that, and it changes from week to week. So these
   rules key on the event, and a player's row inherits whatever the
   tournament he is in resolves to.

   Two sources were checked and neither covers everything, which is why
   most of this table is honest about not knowing:

   · ATP's own broadcaster list names TSN in Canada for the tour, and
     Sportsnet for the Canadian Masters event specifically.
   · The US Open's own international broadcaster page names TSN and RDS.

   A Grand Slam is not an ATP tour event and its rights are sold
   separately, so the ATP listing says nothing about Melbourne, Paris or
   Wimbledon — those resolve to Coverage TBD rather than being assumed to
   follow the tour. Neither source covers the WTA tour at all, so a WTA
   event outside a Slam is unknown too. Guessing here would put a service
   badge on a match nobody can confirm is carried. */
const CANADA_MASTERS = /national bank open|canada masters|rogers cup|omnium banque nationale/i;
const US_OPEN = /^us open$/i;

const RIGHTS = [
  /* ---------------- tennis ----------------
     Slam first: its rights are its own, whichever tour the draw sits in. */
  {comp:"ATP", when:g=>US_OPEN.test(g.tournament), carriers:[tv("TSN"), tv("RDS")], confidence:"confirmed",
   note:"The US Open's own international broadcaster listing names TSN and RDS for Canada. Grand Slam rights are sold separately from the ATP tour deal", src:SRC.usopen, checked:CHECKED},
  {comp:"WTA", when:g=>US_OPEN.test(g.tournament), carriers:[tv("TSN"), tv("RDS")], confidence:"confirmed",
   note:"The US Open's own international broadcaster listing names TSN and RDS for Canada. Grand Slam rights are sold separately from the WTA tour deal", src:SRC.usopen, checked:CHECKED},
  {comp:"ATP", when:g=>g.major, carriers:[], confidence:"unknown",
   note:"A Grand Slam outside the US Open. Its Canadian rights are sold separately from the ATP tour deal and no current source was found for them", src:SRC.none, checked:CHECKED},
  {comp:"WTA", when:g=>g.major, carriers:[], confidence:"unknown",
   note:"A Grand Slam outside the US Open. Its Canadian rights are sold separately from the WTA tour deal and no current source was found for them", src:SRC.none, checked:CHECKED},
  {comp:"ATP", when:g=>CANADA_MASTERS.test(g.tournament), carriers:[tv("Sportsnet")], confidence:"confirmed",
   note:"ATP's broadcaster list names Sportsnet for the Canadian Masters event", src:SRC.atptv, checked:CHECKED},
  {comp:"WTA", when:g=>CANADA_MASTERS.test(g.tournament), carriers:[], confidence:"unknown",
   note:"ATP's listing covers the men's Canadian Masters only; no current source was found for the women's event", src:SRC.none, checked:CHECKED},
  {comp:"ATP", carriers:[tv("TSN"), st("TSN+")], confidence:"expected",
   note:"ATP's own broadcaster list names TSN as the Canadian home of the tour. Which specific matches reach a channel is not published per event, so this is the tour deal rather than a confirmed listing for this match", src:SRC.atptv, checked:CHECKED},
  {comp:"WTA", carriers:[], confidence:"unknown",
   note:"No current Canadian rights source was found for the WTA tour. ATP's broadcaster list does not cover it", src:SRC.none, checked:CHECKED},

  /* ---------------- cycling ----------------
     Refreshingly simple: one platform holds essentially the whole
     men's and women's WorldTour in Canada. */
  {comp:"UCI", carriers:[st("FloBikes")], confidence:"confirmed",
   note:"Exclusive Canadian home of the men's and women's WorldTour", src:SRC.flo, checked:CHECKED},

  /* ---------------- soccer ---------------- */
  {comp:"EPL", carriers:[st("Fubo Canada")], confidence:"confirmed",
   note:"Exclusive — every match, through 2027-28. Note: LiveSoccerTV also lists DAZN Canada for EPL fixtures; Fubo's own release says exclusive, so Fubo is used here", src:SRC.fubo, checked:CHECKED},
  {comp:"UCL", carriers:[st("DAZN Canada")], confidence:"confirmed",
   note:"Exclusive UEFA club competitions", src:SRC.dazn, checked:CHECKED},
  {comp:"EFL", carriers:[st("DAZN Canada")], confidence:"confirmed",
   note:"League Cup, 2024–2028", src:SRC.daznlist, checked:CHECKED},
  {comp:"FAC", carriers:[], confidence:"unknown",
   note:"No Canadian rights holder found — re-check before the third round in January", src:SRC.none, checked:CHECKED},
  {comp:"SERIEA", carriers:[st("DAZN Canada")], confidence:"confirmed", note:"2024–2027", src:SRC.daznlist, checked:CHECKED},
  {comp:"BUNDES", carriers:[st("DAZN Canada")], confidence:"confirmed", note:"2025–2028", src:SRC.daznlist, checked:CHECKED},
  {comp:"LALIGA", carriers:[], confidence:"unknown", note:"Canadian carrier not confirmed", src:SRC.none, checked:CHECKED},
  {comp:"LIGUE1", carriers:[], confidence:"unknown", note:"Canadian carrier not confirmed", src:SRC.none, checked:CHECKED},

  /* ---------------- MLS ---------------- */
  {comp:"MLS", when:g=>CDN_MLS.some(id=>g.has(id)), carriers:[st("MLS Season Pass"), tv("TSN")], confidence:"expected",
   note:"Apple carries every match; TSN/RDS simulcast at least one Canadian club match a week — that simulcast window runs to 2026", src:SRC.wikica, checked:CHECKED},
  {comp:"MLS", carriers:[st("MLS Season Pass")], confidence:"confirmed",
   note:"Apple is global rightsholder, every match, through 2032", src:SRC.wikica, checked:CHECKED},

  /* ---------------- NHL: first year of the new Rogers deal ---------------- */
  {comp:"NHL", when:g=>g.dow===3, carriers:[st("Prime Video")], confidence:"confirmed",
   note:"Wednesday national exclusive — 26+ games, from 2026-27", src:SRC.rogers, checked:CHECKED},
  {comp:"NHL", when:g=>g.dow===6||g.dow===1, carriers:[tv("Sportsnet"), st("Sportsnet+")], confidence:"confirmed",
   note:"Sportsnet national window (Sat + Mon). Hockey Night in Canada is no longer on CBC", src:SRC.cbc, checked:CHECKED},
  {comp:"NHL", when:g=>g.has("mtl-nhl"), carriers:[tv("TSN5"), tv("RDS"), st("TSN+")], confidence:"confirmed",

  {comp:"NHL", when:g=>g.has("ott"), carriers:[tv("TSN5"), st("TSN+")], confidence:"expected", note:"Senators regional — Bell Media", src:SRC.tsnreg, checked:CHECKED},
  {comp:"NHL", when:g=>g.has("wpg"), carriers:[tv("TSN3"), st("TSN+")], confidence:"expected", note:"Jets regional — TSN", src:SRC.tsnreg, checked:CHECKED},
  {comp:"NHL", when:g=>g.has("van-nhl"), carriers:[tv("Sportsnet Pacific"), st("Sportsnet+")], confidence:"expected", note:"Canucks regional — Sportsnet", src:SRC.rogers, checked:CHECKED},
  {comp:"NHL", when:g=>g.has("tor-nhl"), carriers:[tv("Sportsnet Ontario"), st("Sportsnet+")], confidence:"expected", note:"Leafs regional — Rogers-owned", src:SRC.rogers, checked:CHECKED},
  {comp:"NHL", when:g=>g.has("edm")||g.has("cgy"), carriers:[tv("Sportsnet West"), st("Sportsnet+")], confidence:"expected", note:"Oilers/Flames regional", src:SRC.rogers, checked:CHECKED},
  {comp:"NHL", carriers:[tv("Sportsnet One"), st("Sportsnet+")], confidence:"expected",
   note:"Sportsnet is national rightsholder for all other games", src:SRC.rogers, checked:CHECKED},

  /* ---------------- MLB ---------------- */
  {comp:"MLB", when:g=>g.stage!=="", carriers:[tv("Sportsnet"), st("Sportsnet+")], confidence:"confirmed",
   note:"Sportsnet holds national MLB rights in Canada; Sportsnet+ carries the entire postseason", src:SRC.jays, checked:CHECKED},
  {comp:"MLB", when:g=>g.has("tor-mlb"), carriers:[tv("Sportsnet"), st("Sportsnet+")], confidence:"confirmed",
   note:"Rogers owns the Blue Jays — every game on Sportsnet", src:SRC.wikica, checked:CHECKED},
  {comp:"MLB", carriers:[st("MLB.TV")], confidence:"expected",
   note:"Out-of-market. Some national US games also appear on TSN or RDS", src:SRC.wikica, checked:CHECKED},

  /* ---------------- NBA ---------------- */
  {comp:"NBA", when:g=>g.has("tor-nba"), carriers:[tv("TSN"), tv("Sportsnet")], confidence:"confirmed",
   note:"TSN and Sportsnet split Raptors games 50-50; unchanged by the Rogers–MLSE deal", src:SRC.raptors, checked:CHECKED},
  {comp:"NBA", carriers:[tv("TSN"), st("NBA League Pass")], confidence:"expected",
   note:"Coverage shared between TSN, Sportsnet and NBA TV Canada; rest on League Pass", src:SRC.wikica, checked:CHECKED},

  /* ---------------- NFL ---------------- */
  {comp:"NFL", when:g=>g.dow===4||g.dow===1, carriers:[tv("TSN"), tv("RDS"), st("DAZN")], confidence:"confirmed",
   note:"TSN carries all primetime games — Thursday, Sunday and Monday night", src:SRC.nflca, checked:CHECKED},
  {comp:"NFL", when:g=>g.dow===0&&g.hour>=19, carriers:[tv("TSN"), st("DAZN")], confidence:"confirmed",
   note:"Sunday Night Football — TSN", src:SRC.nflca, checked:CHECKED},
  {comp:"NFL", carriers:[tv("CTV"), tv("RDS"), st("DAZN")], confidence:"confirmed",
   note:"CTV is the free-to-air home of Sunday afternoon games; DAZN carries every game via Game Pass", src:SRC.nflca, checked:CHECKED}
];

function resolveRights(g){
  const ids = [g.home&&g.home.id, g.away&&g.away.id];
  const ctx = {stage:g.stage||"", has:id=>ids.indexOf(id)>=0, comp:g.comp, hour:g.slotHour||0,
    // tennis rules key on the tournament; every other sport ignores these
    tournament:(g.match && g.match.tournament) || "", major:!!(g.match && g.match.major)};
  // day-of-week must be the HOME team's local day, not UTC
  ctx.dow = g.localDow;
  if(g.liveCarriers) return {carriers:g.liveCarriers, confidence:"confirmed", listed:true,
    note:"Taken from a published TV listing, not inferred", src:g.liveSrc, checked:CHECKED};
  for(const r of RIGHTS){
    if(r.comp!==g.comp) continue;
    if(r.when && !r.when(ctx)) continue;
    return r;
  }
  return {carriers:[], confidence:"unknown", note:"No rule matched", src:SRC.none};
}

/* ============================ time helpers ============================ */
/* Zone offsets used to be four hardcoded changeover instants, correct
   only for the two seasons someone had written down and silently wrong
   after them. They are read from the platform now, by the same method as
   scripts/lib/dates.mjs: format the instant in the zone, read the wall
   clock back, and the gap to the real instant is the offset. The build
   and the page therefore derive the same answer from the same source of
   truth rather than from two tables that can drift apart.

   Intl with an IANA timeZone is used unguarded here, as it already is
   for every time this page prints. */
const ZONE_IANA = {ET:"America/New_York", CT:"America/Chicago", MT:"America/Denver",
  PT:"America/Los_Angeles", UK:"Europe/London", CET:"Europe/Paris", UTC:"UTC"};
const _zoneFmt = {};
function zoneParts(tz, ms){
  const zone = ZONE_IANA[tz] || "UTC";
  let f = _zoneFmt[zone];
  if(!f){
    f = _zoneFmt[zone] = new Intl.DateTimeFormat("en-US", {timeZone:zone,
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
  }
  const out = {};
  for(const part of f.formatToParts(new Date(ms))) out[part.type] = part.value;
  return out;
}
function offsetFor(tz, ms){
  const p = zoneParts(tz, ms);
  const wallAsUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
  return Math.round((wallAsUTC - ms) / 3600000);
}
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const makeStart = (dayMs, tz, hh, mm) => dayMs + (hh-offsetFor(tz,dayMs))*3600000 + mm*60000;
const localKey = ms => ymd(new Date(ms));
const fmtTime = ms => new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(new Date(ms));
const fmtDayLong = key => { const [y,m,d]=key.split("-").map(Number); return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(new Date(y,m-1,d)); };
const fmtShortDate = ms => new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"}).format(new Date(ms));

function hash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const pick = (arr,r)=>arr[Math.floor(r()*arr.length)];

/* ============================ fixtures ============================
   Every fixture on this page is a real one. There is no generator any
   more: what you see came from a published feed, and where the feed has
   nothing, the page shows nothing rather than a plausible guess.
   ================================================================== */
const DAY = 86400000;
const GAMES = [];
let gid = 0;
function addGame(o){
  o.id = o.comp+"-"+(++gid)+"-"+(o.home?o.home.id:"x")+"-"+(o.away?o.away.id:"tbd");
  o.seed = hash(o.id);
  o.stage = o.stage || "";
  GAMES.push(o);
  return o;
}
/* Two fixtures are the same game when the competition and both clubs
   match and they start within four hours of each other. Four hours, not
   the same calendar day: a baseball doubleheader is two genuinely
   different games between the same clubs on one date, and collapsing
   them would silently hide one. */
const SAME_WINDOW = 4*3600000;
function normName(x){
  return (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
/* Clubs outside the followable roster get a synthetic id, and the prefix
   depends on which path created them — the committed file, a direct
   fetch, or a remembered result. Comparing those raw made one game look
   like two. Identity is the roster id where there is one, and the club's
   name where there isn't. */
function idKey(t){
  if(!t) return "";
  return (t.id && !/^(feed|espn):/.test(t.id)) ? t.id : normName(t.name);
}
function sameGame(a, b){
  if(!a.away || !b.away || a.comp !== b.comp) return false;
  /* The source's own event id settles it outright where both copies have
     one — including a postponement, where the clubs match but the start
     has moved by a day and the composite key below would call it a
     different fixture. Two different ids are two different games, however
     close together they sit. */
  if(a.eid && b.eid) return a.eid === b.eid;
  if(Math.abs(a.start - b.start) >= SAME_WINDOW) return false;
  const ah = idKey(a.home), aa = idKey(a.away), bh = idKey(b.home), ba = idKey(b.away);
  return (ah === bh && aa === ba) || (ah === ba && aa === bh);
}
function mergeReal(built){
  // Replace by identity. Without this a refresh re-added every fixture
  // it had already loaded, so a page left open during a game slowly
  // filled with duplicates of itself.
  built.forEach(g=>{
    for(let i=GAMES.length-1;i>=0;i--){
      if(!sameGame(GAMES[i], g)) continue;
      /* A newer copy replaces an older one — but ESPN's season schedule
         reports a finished game as scheduled with no score, so a plain
         replacement can erase a final we already hold. Keep the known
         result in that one case, and mark it remembered so it is
         labelled rather than passed off as freshly fetched. A newer copy
         that does carry a score always wins. */
      const prev = GAMES[i];
      const hadFinal = prev.result && prev.result.status === "final" && prev.result.score;
      const hasScore = g.result && g.result.score;
      if(hadFinal && !hasScore){ g.result = prev.result; g.remembered = true; }
      /* The live top-up runs every minute; the committed file is rebuilt
         every three hours. A score already on the page can therefore be
         newer than the one arriving from the file, and letting the file
         win regardless put a match back to its halftime score on every
         refresh. A final from the file still wins — that is the one
         thing it can know that a missed top-up did not. */
      else if(prev.result && prev.result.score && g.fromFeed &&
              g.result && g.result.status !== "final"){
        g.result = prev.result;
      }
      /* Matched by id but the clock moved: keep where it originally sat,
         so a reschedule can be seen rather than silently applied. */
      if(prev.start !== g.start){
        g.startOriginal = prev.startOriginal || prev.start;
        g.moved = g.startOriginal;      // the row renders this as "was <time>"
      }
      GAMES.splice(i,1);
    }
  });
  // then retire baked fallback fixtures inside any window the feed covers
  const spans = {};
  built.forEach(g=>{
    [g.home&&g.home.id, g.away&&g.away.id].forEach(id=>{
      if(!id) return;
      const k = g.comp+"|"+id, sp = spans[k];
      spans[k] = sp ? [Math.min(sp[0],g.start), Math.max(sp[1],g.start)] : [g.start,g.start];
    });
  });
  for(let i=GAMES.length-1;i>=0;i--){
    const g = GAMES[i];
    if(g.espn) continue;
    const ids = [g.home&&g.home.id, g.away&&g.away.id];
    const hit = ids.some(id=>{
      const sp = spans[g.comp+"|"+id];
      return sp && g.start >= sp[0]-12*3600000 && g.start <= sp[1]+12*3600000;
    });
    if(hit) GAMES.splice(i,1);
  }
  built.forEach(g=>addGame(g));
  GAMES.sort((a,b)=>a.start-b.start);
}

/* ---- remembered results ------------------------------------------
   A final score, once fetched, is kept in this browser for a week. So
   a game you missed still has its score tomorrow even if the feed is
   slow, unreachable, or has moved that day out of its window. Local to
   the viewer, like every other preference here.
   ------------------------------------------------------------------ */
const RESULTS_KEY = "gdn.results";
const RESULTS_VERSION = 2;
/* Stored results were a bare array with no version, so any change to the
   shape would have been read as if it were the current one. The store is
   versioned now, every row is validated before it is trusted, and a
   payload that cannot be understood discards that one key rather than
   throwing on the way into the page. Nothing here is allowed to stop the
   app from starting. */
function validResultRow(r, now){
  if(!r || typeof r !== "object") return false;
  if(typeof r.c !== "string" || !r.c) return false;
  if(typeof r.t !== "number" || !isFinite(r.t)) return false;
  if(r.t < now - 8*DAY || r.t > now + DAY) return false;      // expired or absurd
  if(!Array.isArray(r.s) || r.s.length !== 2) return false;
  if(!r.s.every(n => typeof n === "number" && isFinite(n))) return false;
  for(const side of [r.h, r.a]){
    if(!Array.isArray(side) || side.length < 2) return false;
    if(typeof side[0] !== "string" || !side[0]) return false;
    if(typeof side[1] !== "string" || !side[1]) return false;
  }
  return true;
}
/* Returns the usable rows, whatever shape was on disk. A legacy bare
   array is migrated; an unknown version is discarded, because guessing
   at a shape written by a newer build is exactly how a wrong score
   reaches the screen. */
function readResultStore(raw, now){
  if(Array.isArray(raw)) return {rows: raw.filter(r=>validResultRow(r, now)), migrated: true};
  if(!raw || typeof raw !== "object") return {rows: [], migrated: false};
  if(raw.v !== RESULTS_VERSION) return {rows: [], migrated: false, discarded: true};
  if(!Array.isArray(raw.rows)) return {rows: [], migrated: false, discarded: true};
  return {rows: raw.rows.filter(r=>validResultRow(r, now)), migrated: false};
}
function rememberResults(){
  try{
    const now = Date.now(), rows = [];
    GAMES.forEach(g=>{
      if(!g.away || !g.result || !g.result.score) return;
      if(g.result.status !== "final") return;
      if(g.start < now - 8*DAY || g.start > now) return;
      rows.push({c:g.comp, t:g.start, s:g.result.score, l:g.result.label,
        h:[g.home.id, fullName(g.home), g.home.abbr, g.home.color, g.home.city || ""],
        a:[g.away.id, fullName(g.away), g.away.abbr, g.away.color, g.away.city || ""]});
    });
    LS.set(RESULTS_KEY, {v:RESULTS_VERSION, saved:now, rows:rows.slice(-80)});
  }catch(e){}
}
function recallResults(){
  const now = Date.now(), built = [];
  let store;
  try{ store = readResultStore(LS.get(RESULTS_KEY, null), now); }
  catch(e){ store = {rows:[], discarded:true}; }
  if(store.discarded){ try{ localStorage.removeItem(RESULTS_KEY); }catch(e){} }
  const rows = store.rows;
  if(!rows.length) return;
  // full:true — the stored name is already complete, so the renderer must
  // not prepend the city to it a second time
  const team = (r, comp) => TEAMS[r[0]] || {id:r[0], home:comp, city:r[4] || "", name:r[1],
    abbr:r[2] || "?", color:r[3] || "#5A6478", ghost:true, full:true, comps:[comp]};
  rows.forEach(r=>{
    built.push({comp:r.c, home:team(r.h, r.c), away:team(r.a, r.c), start:r.t, moved:null,
      real:true, espn:true, listed:true, remembered:true,
      localDow:new Date(r.t).getUTCDay(), slotHour:new Date(r.t).getUTCHours(), stage:"",
      result:{status:"final", label:r.l || "Final", score:r.s}});
  });
  if(built.length) mergeReal(built);
}

const ESPN = "https://site.api.espn.com/apis/site/v2/sports/";
const ESPN_PATH = {

const ESPN_NAME = {
  liv:"Liverpool", ars:"Arsenal", mci:"Manchester City", mun:"Manchester United",
  che:"Chelsea", tot:"Tottenham Hotspur", new:"Newcastle United", nfo:"Nottingham Forest",
  bou:"AFC Bournemouth", ips:"Ipswich Town", avl:"Aston Villa", bha:"Brighton & Hove Albion",

  rma:"Real Madrid", bar:"Barcelona", bay:"Bayern Munich", psg:"Paris Saint-Germain", int:"Internazionale",

  lafc:"LAFC", mia:"Inter Miami CF", sou:"Seattle Sounders FC"

const norm = x => (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

/* `init` is merged into the fetch, for the one caller that needs to say
   something about caching. The abort signal is applied last so a caller
   can never drop the timeout. */
async function jget(url, ms, init){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms||9000);
  try{
    const res = await fetch(url, Object.assign({mode:"cors"}, init, {signal:ctl.signal}));
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function espnTeamObj(e, comp){
  if(!e) return null;
  const disp = e.displayName || e.name || "";
  for(const t of allTeams){
    if(t.home!==comp && (t.comps||[]).indexOf(comp)<0) continue;
    if(ESPN_NAME[t.id] && norm(ESPN_NAME[t.id])===norm(disp)) return t;
    if(norm(t.city+" "+t.name)===norm(disp)) return t;
    if(norm(t.name)===norm(disp)) return t;
  }
  const key = "espn:"+comp+":"+(e.id||e.abbreviation||norm(disp));
  if(!TEAMS[key]){
    TEAMS[key] = {id:key, home:comp, city:e.location||"", name:disp || e.name || "?",
      abbr:(e.abbreviation||norm(disp).slice(0,3)).toUpperCase().slice(0,4), tz:"ET",
      color:e.color?("#"+String(e.color).replace("#","")):"#5A6478", ghost:true, full:true, comps:[comp]};
    allTeams.push(TEAMS[key]);

function parseEvent(ev, comp){
  const cp = (ev.competitions && ev.competitions[0]) || ev;
  const cs = cp.competitors || [];
  const H = cs.find(c=>c.homeAway==="home") || cs[0];
  const A = cs.find(c=>c.homeAway==="away") || cs[1];
  if(!H || !A) return null;
  const home = espnTeamObj(H.team, comp), away = espnTeamObj(A.team, comp);
  if(!home || !away) return null;
  const start = Date.parse(ev.date || cp.date);
  if(!start) return null;
  const stt = (cp.status || ev.status || {});
  const ty = stt.type || {};
  const nm = ty.name || "";
  /* ESPN publishes the lifecycle as a field of its own — state is "pre",
     "in" or "post", and completed is a boolean. Read those rather than
     the wording of the status: "in" already covers halftime, a rain
     delay, extra time, overtime and a shootout, every one of which the
     name matching below had to be told about individually and got wrong
     the moment ESPN added another. Only completed or "post" ends a game;
     elapsed time never does. The names remain the fallback for a payload
     that carries no state at all. */
  const state = ty.state || "";
  const status = (ty.completed === true || state === "post") ? "final"
               : state === "in" ? "live"
               : state === "pre" ? "scheduled"

               : /IN_PROGRESS|HALFTIME|END_PERIOD|FIRST_HALF|SECOND_HALF|RAIN|DELAY/.test(nm) ? "live"
               : "scheduled";
  const num = v => { const n = parseInt(v==null?"":String(v).replace(/[^0-9-]/g,""),10); return isNaN(n)?null:n; };
  const sh = num(H.score && H.score.displayValue!=null ? H.score.displayValue : H.score);
  const sa = num(A.score && A.score.displayValue!=null ? A.score.displayValue : A.score);
  const label = ty.shortDetail || ty.description || (status==="final"?"Final":"");
  return {
    eid: (ev.id != null ? String(ev.id) : (cp.id != null ? String(cp.id) : null)),
    comp, home, away, start, moved:null, real:true, espn:true, listed:true,
    localDow:new Date(start).getUTCDay(), slotHour:new Date(start).getUTCHours(), stage:"",
    result: (status==="scheduled" || sh===null || sa===null)
      ? {status, label:label||"", score:null}
      : {status, label:label||(status==="final"?"Final":""), score:[sh,sa]}
  };
}
/* ---- the repo's own prebuilt fixtures ----------------------------
   A scheduled job commits data.json next to this page, so the ordinary
   visit is one request to our own domain instead of a dozen to an
   undocumented API. Live scores still come straight from the source,
   because a file refreshed every half hour cannot follow a game.
   ------------------------------------------------------------------ */
let staticAt = 0, staticCount = 0;
function staticTeam(t, comp){
  if(t.id && TEAMS[t.id]) return TEAMS[t.id];
  const key = "feed:"+comp+":"+(t.id || t.abbr || norm(t.name));
  if(!TEAMS[key]){
    TEAMS[key] = {id:key, home:comp, city:t.city || "", name:t.name || "?", abbr:(t.abbr||"?").slice(0,4),
      color:t.color || "#5A6478", ghost:true, full:true, comps:[comp]};
    allTeams.push(TEAMS[key]);
  }
  return TEAMS[key];
}
async function loadStatic(){
  let r;
  /* GitHub Pages serves data.json with max-age=600, so a browser that
     already has a copy will answer from it for ten minutes — long enough
     for a score the scheduled job has already committed to stay
     invisible through several refresh cycles. "no-cache" does not mean
     "do not cache": the copy is still stored and still sent back with
     its validator, so an unchanged file costs a 304 and no body. Only
     this file asks for it; the API calls keep ordinary caching. */
  try{ r = await jget(new URL("data.json", location.href).href, 12000, {cache:"no-cache"}); }
  catch(e){ return 0; }
  if(!r || !Array.isArray(r.fixtures)) return 0;
  const built = [];
  r.fixtures.forEach(f=>{
    if(!f || !f.home || !f.away || !f.start) return;
    const home = staticTeam(f.home, f.comp), away = staticTeam(f.away, f.comp);
    if(!selected.has(home.id) && !selected.has(away.id)) return;
    built.push({eid:f.eid || null, comp:f.comp, home, away, start:f.start, moved:null,
      real:true, espn:true, listed:true, fromFeed:true,
      localDow:new Date(f.start).getUTCDay(), slotHour:new Date(f.start).getUTCHours(), stage:"",
      result:{status:f.status || "scheduled", label:f.label || "", score:f.score || null}});
  });
  if(built.length) mergeReal(built);
  if(Array.isArray(r.cycling)) attachCycling(r.cycling);
  /* The picker's search list. Small enough to travel with the schedule
     file, which means typing a name costs no request at all. */
  if(Array.isArray(r.players)) PLAYER_DIR = r.players.filter(x=>Array.isArray(x) && x.length >= 2);
  staticAt = Date.parse(r.generated) || 0;
  staticCount = built.length;
  return built.length;
}

/* ============================================================
   TENNIS — ATP and WTA singles, followed by player.

   Tennis is the one sport here that is not a fixture list. A viewer
   follows Alcaraz, not the US Open, and the matches that matter are
   wherever he happens to be drawn that week. ESPN publishes that as a
   tournament containing groupings containing competitions, about 2 MB
   across the two tours, with a Grand Slam repeated in full under both —
   so the browser never sees it. /api/tennis does the reading, keeps the
   singles matches involving the players actually being followed, and
   returns a few kilobytes. See scripts/lib/tennis.mjs for the parser and
   api/tennis.js for the endpoint.

   Follow nobody and none of this runs: no request is made, no row is
   built, and the tennis chips never appear.
   ============================================================ */
const TENNIS_TOURS = {ATP:"atp", WTA:"wta"};
/* Statuses that mean no more play. Mirrors SETTLED in
   scripts/lib/tennis.mjs — the two are asserted equal by the tests,
   because a page that thinks a retirement is still live would poll it
   for ever. */
const TENNIS_SETTLED = {final:1, retired:1, walkover:1, canceled:1, postponed:1};
let PLAYER_DIR = [];          // [id, name, tour, country] — search fodder for the picker
let tennisAt = 0;             // when the matches on screen were normalised
let tennisErr = "";

/* A normalised match, as a row this page can place on a day. home and
   away stay null: tennis has no home side, and leaving them empty is
   what keeps every team-sport path — scoring, remembering, merging —
   from trying to treat a match as a fixture. */
function tennisGame(m){
  const d = new Date(m.start);
  return {id:"tennis-"+m.id, comp:m.tour, home:null, away:null, start:m.start,
    timeKnown:m.timeKnown, moved:null, real:true, espn:true, listed:true,
    tennis:true, match:m, seed:hash("tennis-"+m.id),
    localDow:d.getUTCDay(), slotHour:d.getUTCHours(), stage:"", result:null};
}
/* The response is the whole truth for the players being followed, so the
   tennis rows are replaced outright rather than merged. Anything else
   would leave a match on screen for a player who has just been
   unfollowed. */
function mergeTennis(matches){
  for(let i=GAMES.length-1;i>=0;i--) if(GAMES[i].tennis) GAMES.splice(i,1);
  matches.forEach(m=>GAMES.push(tennisGame(m)));
  GAMES.sort((a,b)=>a.start-b.start);
}
/* Still capable of changing. A suspended match resumes, and a match the
   source still calls scheduled after its start time is simply one ESPN
   has not caught up with — both are worth another look. Anything settled
   is not, however recently it finished. */
function tennisActive(m, now){
  if(!m) return false;
  if(TENNIS_SETTLED[m.status]) return false;
  if(m.status === "live" || m.status === "suspended" || m.status === "unknown") return true;
  return now >= m.start && now - m.start < POLL_WINDOW;
}
/* Which tours to ask about. Following only women costs no ATP request. */
function toursOf(only){
  const t = new Set();
  const now = Date.now();
  GAMES.forEach(g=>{
    if(!g.tennis || !isMine(g)) return;
    if(only && !tennisActive(g.match, now)) return;
    if(TENNIS_TOURS[g.comp]) t.add(TENNIS_TOURS[g.comp]);
  });
  if(!only && !t.size){
    // nothing loaded yet: fall back to whichever tours the picker says
    PLAYER_DIR.forEach(r=>{ if(players.has(r[0])) String(r[2]).split("/").forEach(x=>{
      if(TENNIS_TOURS[x]) t.add(TENNIS_TOURS[x]);
    }); });
  }
  return [...t].sort();
}
async function loadTennis(only){
  if(!players.size){
    if(GAMES.some(g=>g.tennis)) mergeTennis([]);
    tennisAt = 0; tennisErr = "";
    return 0;
  }
  const url = new URL("api/tennis", location.href);
  /* Sorted, so two viewers following the same players ask for the same
     URL and share one cached answer rather than each costing a fetch. */
  url.searchParams.set("players", [...players].sort().join("."));
  const tours = toursOf(only);
  if(tours.length && tours.length < 2) url.searchParams.set("tours", tours.join(","));
  const r = await jget(url.href, 12000, {cache:"no-cache"});
  if(!r || !Array.isArray(r.matches)) throw new Error("tennis: unusable response");
  mergeTennis(r.matches);
  tennisAt = Date.parse(r.generated) || Date.now();
  tennisErr = "";
  return r.matches.length;
}

/* Stage podiums and the race lead are results: they arrive from the
   committed file or they don't exist. Nothing here invents one. */
function attachCycling(races){
  const today = ymd(new Date());
  // "Vuelta a España" must match "La Vuelta Ciclista a España" — plain
  // substring fails on the word in the middle, so match on tokens: every
  // significant word of the shorter name appearing in the longer one.
  const tok = x => ((x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/[a-z0-9]{4,}/g)) || [];
  const raceMatch = (a, b) => {
    const ta = tok(a), tb = tok(b), na = normName(a), nb = normName(b);
    if(!ta.length || !tb.length) return false;
    return ta.every(t=>nb.indexOf(t)>=0) || tb.every(t=>na.indexOf(t)>=0);
  };
  races.forEach(rc=>{
    if(!rc.race) return;
    const mine = GAMES.filter(g=>g.event && raceMatch(g.race, rc.race));
    if(!mine.length) return;
    let moved = false;
    (rc.stages||[]).forEach(st=>{
      const g = mine.find(x=>localKey(x.start)===st.date);
      if(!g) return;
      if(Array.isArray(st.top3) && st.top3.length===3) g.podium = st.top3;
      // a published timetable upgrades "All day" to a real clock
      if(st.startUtc && localKey(st.startUtc)===st.date){
        g.start = st.startUtc; g.timeKnown = true; moved = true;
      }
      if(st.finishUtc) g.finishUtc = st.finishUtc;
    });
    if(moved) GAMES.sort((a,b)=>a.start-b.start);
    // the current lead belongs on the most recent stage that has happened
    if(rc.leader && !rc.oneDay){
      const past = mine.filter(x=>localKey(x.start)<=today).sort((a,b)=>b.start-a.start);
      if(past[0]) past[0].leader = rc.leader;
    }
  });
}

const espnCache = {};
async function espnTeamsList(comp){
  if(espnCache[comp]) return espnCache[comp];
  const r = await jget(ESPN+ESPN_PATH[comp]+"/teams?limit=500", 9000);
  const lg = r && r.sports && r.sports[0] && r.sports[0].leagues && r.sports[0].leagues[0];
  const list = ((lg && lg.teams) || []).map(x=>x.team).filter(Boolean);
  espnCache[comp] = list;
  return list;
}
const bare = n => norm(String(n||"").replace(/\b(fc|cf|sc|afc)\b/gi,""));
function findEspnTeam(t, list){
  const want = norm(ESPN_NAME[t.id] || (t.city+" "+t.name));
  return list.find(e=>norm(e.displayName)===want)
      || list.find(e=>bare(e.displayName)===bare(ESPN_NAME[t.id] || (t.city+" "+t.name)))
      || list.find(e=>norm(e.displayName)===norm(t.city+" "+t.name))
      || list.find(e=>norm(e.name)===norm(t.name) && norm(e.location)===norm(t.city))
      || list.find(e=>norm(e.name)===norm(t.name))
      || list.find(e=>norm(e.abbreviation)===norm(t.abbr));
}
const NA = {NHL:1, NBA:1, NFL:1, MLB:1};
/* ESPN files a game under its US Eastern date — a 7:05pm EDT game is
   the 21st there and the 22nd in UTC. Ask for the wrong one and you get
   an empty day. */
/* Soccer answers a whole month at a time — YYYYMM. A YYYYMMDD-YYYYMMDD
   range looks like it works and silently returns only the first day. */
function monthKeys(a, b){
  const out = [], d = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1));
  while(d <= b && out.length < 6){
    out.push(d.getUTCFullYear()+pad(d.getUTCMonth()+1));
    d.setUTCMonth(d.getUTCMonth()+1);
  }
  return out;
}
function espnDate(ms){
  const p = zoneParts("ET", ms);
  return p.year + p.month + p.day;
}

/* ---- merging a scoreboard event into a fixture already on the page ---
   The two copies of one fixture routinely disagree about a club's id.
   The committed file mints a `feed:` id for any club the build could not
   map to the roster, while a scoreboard read of that same club resolves
   it to its roster id — so Fulham arrives as `feed:EPL:FUL` from the
   file and as `ful` from ESPN. Comparing those raw is what left a game
   reading "scheduled" while the source had it live at 1-2. Identity here
   is sameGame()'s: the source's own event id where both copies carry
   one, the competition/clubs/start composite where they do not.
   ------------------------------------------------------------------ */

/* Every name a club is known by, normalised. The file writes a name in
   full — "Toronto Blue Jays" — where the roster splits it into a city
   and a name, so a club record matches on whichever of these two
   descriptions the other side happened to use. */
function clubKeys(t){
  if(!t) return [];
  const keys = [idKey(t)];
  if(t.name) keys.push(normName(t.name), normName((t.city || "") + " " + t.name));
  if(ESPN_NAME[t.id]) keys.push(normName(ESPN_NAME[t.id]));
  return keys.filter(Boolean);
}
const sameClub = (a, b) => clubKeys(a).some(k => clubKeys(b).indexOf(k) >= 0);

/* Which way round the two copies list the clubs. The event itself is
   settled by the time this runs, so this only has to tell one of two
   known clubs from the other — a weaker question than identity, and one
   it can answer more loosely. 1 as listed, -1 reversed, 0 undecidable.
   A score whose orientation cannot be established is worse than no score
   at all, so the caller drops it rather than guess which way it goes. */
function orientation(mine, parsed){
  const straight = (sameClub(mine.home, parsed.home) ? 1 : 0) + (sameClub(mine.away, parsed.away) ? 1 : 0);
  const reversed = (sameClub(mine.home, parsed.away) ? 1 : 0) + (sameClub(mine.away, parsed.home) ? 1 : 0);
  if(straight > reversed) return 1;
  if(reversed > straight) return -1;
  return 0;
}

/* The fixture this scoreboard event is about, if the page holds one.
   Event ids are swept across the whole list before anything else:
   sameGame() already gives the id precedence within a pair, but a baked
   fixture carrying no id can sit at the same kickoff as the fed copy
   that does, and whichever came first would otherwise take the score. */
function findScored(parsed, games){
  if(parsed.eid){
    const byId = games.find(g => g.eid && g.eid === parsed.eid && sameGame(g, parsed));
    if(byId) return byId;
  }
  return games.find(g => sameGame(g, parsed));
}

/* Take a scoreboard event into the fixture it belongs to, and say
   whether anything came of it. */
function applyScored(match, parsed){
  /* The scoreboard is the authority on what is happening now, but a copy
     carrying no score must not erase a final already known — the rule
     mergeReal() applies wherever two copies of a fixture meet. */
  const hadFinal = match.result && match.result.status === "final" && match.result.score;
  if(hadFinal && !parsed.result.score) return false;
  const turn = orientation(match, parsed);
  const sc = turn === 0 ? null : parsed.result.score;
  match.result = {
    status: parsed.result.status,
    label: parsed.result.label,
    score: sc ? (turn < 0 ? [sc[1], sc[0]] : sc) : null
  };
  /* Matched by id but the clock moved: keep where it originally sat, so
     a reschedule is shown rather than silently applied. */
  if(match.start !== parsed.start){
    match.startOriginal = match.startOriginal || match.start;
    match.moved = match.startOriginal;      // the row renders this as "was <time>"
    match.start = parsed.start;
  }
  match.listed = true;
  return true;
}

/* How long after kickoff a fixture is still worth asking about every
   minute. Long enough for extra time, a shootout, a rain delay and a
   game that runs past midnight; short enough that a fixture the feed
   simply never resolved stops asking a minute at a time. This paces
   requests and nothing else — it never decides that a game has
   finished, which is ESPN's to say. */
const POLL_WINDOW = 12*3600000;

/* Which fixtures are worth asking the scoreboard about.

   A fixture with no score has always been eligible. A fixture that is
   under way is eligible too, score or no score: a live score is a
   number that changes, and the old rule — poll until the first score
   arrives — froze a game at whatever it happened to be when that first
   number landed. Fulham 1-2 Chelsea at halftime stayed 1-2 for the rest
   of the match, because by then the fixture had a score and was never
   asked about again.

   A final is asked about once and then left alone. The scheduled rebuild
   of data.json carries the rare post-final correction; there is nothing
   for a minute-by-minute request to discover.

   Cycling never qualifies: a stage has no opponent and no ESPN path, so
   both guards below decline it. Podiums arrive with the committed file,
   which is the only cycling source there is. */
function needsScore(g, now){
  if(!g.away || !ESPN_PATH[g.comp]) return false;
  const st = stateOf(g, now).status;
  if(st === "final") return false;                      // settled — leave it alone
  if(st === "live" || st === "unknown") return true;    // under way — the score moves
  return !(g.result && g.result.score);                 // not started, nothing known yet
}
/* Worth a request this minute: under way, and recent enough that it
   plausibly still is. */
function activeNow(g, now){
  if(!needsScore(g, now)) return false;
  const st = stateOf(g, now).status;
  return (st === "live" || st === "unknown") && now - g.start < POLL_WINDOW;
}

/* Season schedules do not carry a reliable live score, and the scoreboard
   only answers one day at a time. So: fetch schedules for the fixtures,
   then top up scores from the scoreboard for just the handful of days
   that actually need one. */
const scoredDays = new Set();   // competition|date pairs already asked about
async function fillScores(){
  const now = Date.now();
  // newest first: if the request budget runs out it must be the oldest
  // results that wait, never tonight's game
  const need = myGames().filter(g=>
    g.start > now - 4*DAY && g.start < now + 2*3600000 && needsScore(g, now)
  ).sort((a,b)=>b.start-a.start);
  if(!need.length) return 0;
  const todayKey = espnDate(now);
  const days = [];
  need.forEach(g=>{
    const d = espnDate(g.start), k = g.comp+"|"+d;
    if(days.indexOf(k)>=0) return;
    /* A day already tried stays skipped unless it is today, where scores
       move — or unless the fixture itself is still going. A game that
       kicks off at 8pm Eastern and runs past midnight keeps ESPN's
       earlier date, and throttling on the date alone stopped asking
       about it at exactly the point it was most worth asking. */
    const st = stateOf(g, now).status;
    const active = st === "live" || st === "unknown";
    if(scoredDays.has(k) && d !== todayKey && !active) return;
    if(days.length < 12) days.push(k);
  });
  if(!days.length) return 0;
  let filled = 0;
  const answered = [];
  await Promise.all(days.map(async k=>{
    const [comp, d] = k.split("|");
    let r;
    // a request that never got through stays eligible for the next cycle;
    // one that answered — even with nothing — is settled
    try{ r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+d, 9000); }catch(e){ return; }
    answered.push(k);
    (r.events||[]).forEach(ev=>{
      const parsed = parseEvent(ev, comp);
      if(!parsed || !parsed.result) return;
      const match = findScored(parsed, GAMES);
      if(match && applyScored(match, parsed)) filled++;
    });
  }));
  answered.forEach(k=>scoredDays.add(k));
  if(filled) GAMES.sort((a,b)=>a.start-b.start);
  return filled;
}

async function loadLive(){
  const mine = [...selected].map(id=>TEAMS[id]).filter(Boolean);
  if(!mine.length){ return; }
  const naJobs = [], soccerComps = new Set();
  mine.forEach(t=>{
    (t.comps || [t.home]).forEach(c=>{
      if(!ESPN_PATH[c]) return;
      if(NA[c]) { if(c===t.home) naJobs.push([t,c]); }
      else soccerComps.add(c);
    });
  });
  const built = [], errs = [];
  let ok = 0;
  // Out-of-season cups and the odd bad endpoint fail routinely. Each source
  // stands or falls on its own — one failure used to take the whole feed
  // down and leave every score reading "unavailable".
  await Promise.all(naJobs.map(async ([t,comp])=>{
    try{
      const list = await espnTeamsList(comp);
      const e = findEspnTeam(t, list);
      if(!e) { errs.push(comp+": "+t.abbr+" not matched"); return; }
      const sched = await jget(ESPN+ESPN_PATH[comp]+"/teams/"+e.id+"/schedule", 12000);
      (sched.events||[]).forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
      ok++;
    }catch(err){ errs.push(comp+": "+(err && err.message || err)); }
  }));
  // The season-schedule endpoint lags and omits: it can miss a game that
  // is on tonight, and reports finished ones as 0-0 scheduled. The
  // scoreboard is authoritative for what is actually happening, so the
  // near days get fetched there as a source of fixtures in their own
  // right, not merely as a score top-up.
  const naComps = [...new Set(naJobs.map(j=>j[1]))];
  const nearDates = [-3,-2,-1,0,1].map(d=>espnDate(Date.now()+d*DAY));
  await Promise.all(naComps.map(comp=>Promise.all(nearDates.map(async d=>{
    try{
      const r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+d, 9000);
      (r.events||[]).forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
      ok++;
    }catch(err){ /* nothing that day, or out of season */ }
  }))));

  const now = new Date();
  const months = monthKeys(new Date(now.getTime()-10*DAY), new Date(now.getTime()+60*DAY));
  await Promise.all([...soccerComps].map(async comp=>{
    let got = 0, found = 0;
    const take = async m => {
      try{
        const r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+m+"&limit=300", 12000);
        const evs = r.events || [];
        evs.forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
        got++; found += evs.length;
      }catch(err){ /* out of season for that month — not fatal */ }
    };
    // probe the near months first; only keep paging for a competition
    // that is actually running, so dormant cups cost two calls, not five
    await Promise.all(months.slice(0,2).map(take));
    if(found) await Promise.all(months.slice(2).map(take));
    if(got) ok++; else errs.push(comp+": no fixtures published");
  }));
  if(!ok) throw new Error(errs[0] || "no source reachable");
  // keep only fixtures that involve a team you follow
  const keep = built.filter(g=>selected.has(g.home.id) || selected.has(g.away.id));
  const dedup = [];
  keep.forEach(g=>{
    const i = dedup.findIndex(x=>sameGame(x, g));
    if(i < 0){ dedup.push(g); return; }
    const had = dedup[i].result && dedup[i].result.score;
    const better = g.result && g.result.score;
    if(better && !had) dedup[i] = g;   // the copy carrying a score wins
  });
  if(dedup.length) mergeReal(dedup);
  let filled = 0;
  try{ filled = await fillScores(); }catch(e){ errs.push("scores: "+(e && e.message || e)); }
  rememberResults();
  liveNote = dedup.length+" fixture"+(dedup.length===1?"":"s")+" from ESPN, "
    + filled+" score"+(filled===1?"":"s")+" updated"
    + (errs.length?" &middot; skipped: "+errs.slice(0,4).map(esc).join("; "):"");
}

/* ============================================================

/* Kick-off times now come from the feed, so there is nothing to hedge

/* ============================ live state ============================ */

/* A game's state comes from real data or it comes from nothing.
   There is deliberately no code here that invents a score. */
/* Completion is something a source reports, not something a clock infers.
   A delay, extra innings, a weather stoppage and a postponement all look
   identical to elapsed time, and the old rule turned every one of them
   into a confident "Final" for a game still being played. Two states are
   trusted — final and live — and only when a source says so.

   A source still saying "scheduled" after the start counts as nothing
   reported: that is exactly what ESPN's season schedule returns for a
   game already under way. */
/* What is on screen during an outage can come from three places, and
   they are not equally trustworthy. A committed schedule may have moved
   since it was built; the baked list is a small hand-checked set that
   was never going to be current; a remembered result is a score this
   browser saw earlier and kept. One blanket "may be stale" would be
   wrong about two of them, so each says what it actually is.

   Takes staleness as an argument rather than reading it, so the rule can
   be exercised without standing up the whole page. */
function provenanceOf(g, stale){
  if(!g) return null;
  if(g.remembered) return {kind:"remembered", label:"Recalled from this browser"};
  if(g.baked)      return {kind:"baked",      label:"Hand-checked fallback"};
  if(g.fromFeed && stale) return {kind:"stale", label:"Schedule may be stale"};
  return null;
}

function stateOf(g, now){
  if(g.away===null) return {status:"scheduled"};
  const r = g.result, said = r && r.status;
  if(said==="final" || said==="live"){
    return {status:said, score:r.score||null, label:r.label || (said==="final"?"Final":""), real:true};
  }
  if(now < g.start) return {status:"scheduled", score:null};
  return {status:"unknown", label:"Status unavailable", score:null};
}

function servicesFor(g){

  const window = myGames().filter(g=>g.start>=now && g.start<now+90*DAY);
  const need = {}, out = {total:window.length, have:0, unknown:0};
  window.forEach(g=>{

function inkOn(hex){
  const h = hex.replace("#",""); 
  const f = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const L = 0.2126*f(parseInt(h.slice(0,2),16)) + 0.7152*f(parseInt(h.slice(2,4),16)) + 0.0722*f(parseInt(h.slice(4,6),16));

/* A tennis match is two people, not two clubs, and its score is a list
   of sets rather than a pair of numbers. Rendering it through the team

const TENNIS_STATE = {
  live:     {text:"Live",      live:true},
  suspended:{text:"Suspended", live:true,  note:"Play stopped &mdash; not finished"},
  final:    {text:"Final"},
  retired:  {text:"Retired",   note:"Ended early &mdash; opponent retired"},
  walkover: {text:"Walkover",  note:"Not played &mdash; opponent withdrew"},
  canceled: {text:"Canceled",  note:"Match called off"},
  postponed:{text:"Postponed", note:"Moved &mdash; new time not published"},
  unknown:  {text:"Status unavailable"}
};
/* One set as it is actually written: games, and the tiebreak in
   parentheses where there was one. */
function setText(m, i){
  const [a, b] = (m.sets || [])[i] || [null, null];
  if(a == null && b == null) return "";
  const tb = (m.tiebreaks || [])[i];
  const pick = tb ? (tb[0] !== null && tb[1] !== null ? "(" + Math.min(tb[0], tb[1]) + ")" : "") : "";
  return (a === null ? "-" : a) + "-" + (b === null ? "-" : b) + pick;
}
