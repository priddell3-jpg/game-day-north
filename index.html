    + '<span class="g-team'+(mineA?"":" dim")+'">'+crest(o.a)+esc(fullName(o.a))+'</span>'
    + '<span class="at">'+o.sep+'</span>'
    + '<span class="g-team'+(mineB?"":" dim")+(o.b?"":" tbd")+'">'+crest(o.b)+esc(fullName(o.b))+'</span></div>';

  const meta = '<div class="g-meta">'
    + '<span class="lg-tag" style="background:'+c.color+'">'+esc(c.short)+'</span>'
    + (g.listed?'<span class="pill confirmed" title="Real fixture from a published TV listing">Listed</span>':"")
    + (g.stage?'<span>'+esc(g.stage)+'</span>':'')
    + (g.home && g.home.city && normName(g.home.city) !== normName(g.home.name)
        ? '<span>in '+esc(g.home.city)+'</span>' : '')
    /* Said on the fixture itself, not only in a note at the foot of the
       page: a start time from an old file is the thing most likely to
       have moved since. */
    + (function(){
        const p = provenanceOf(g, dataStale);
        return p ? '<span class="conf-note'+(p.kind==="stale"?" warn":"")+'">'+esc(p.label)+'</span>' : '';
      })()
    + '</div>';

  let watch;
  if(!rights.carriers.length){
    watch = '<div class="g-watch"><span class="svc unconfirmed"><span class="pip"></span>Carrier TBC</span>'
      + '<span class="conf-note warn" title="'+esc(rights.note)+'">Not confirmed in Canada</span></div>';
  } else {
    const cov = services.size ? (covered(g)
      ? '<span class="tag-cov have">You have it</span>'
      : '<span class="tag-cov need">Needs '+esc(SERVICES[servicesFor(g)[0]]?SERVICES[servicesFor(g)[0]].label:"a sub")+'</span>') : "";
    watch = '<div class="g-watch">'
      + rights.carriers.map(w=>'<span class="svc '+w.kind+(rights.confidence==="expected"?" expected":"")+'" title="'+esc(rights.note)+'"><span class="pip"></span>'+esc(w.name)+'</span>').join("")
      + (rights.confidence==="expected"?'<span class="conf-note">Expected</span>':"")
      + cov + '</div>';
  }

  let scoreCell = '<div class="g-score">';
  if(ts.state==="tbd"){
    scoreCell += '<span class="countdown">Opponent TBD</span><span class="score-state">Draw ~'+esc(fmtShortDate(g.drawAt))+'</span>';
  } else if(st.status==="scheduled"){
    scoreCell += '<span class="countdown" data-start="'+g.start+'">'+esc(countdownText(g.start,now))+'</span>'
      + '<span class="score-state">'+(ts.state==="tbc" ? "Confirmed by "+esc(fmtShortDate(ts.confirmBy)) : verbOf(g.comp))+'</span>';
  } else if(st.status==="unknown"){
    /* Started, and nothing has said what happened. Do not guess either
       way — no countdown, because it has begun; no "Final", because
       nothing reported one. */
    scoreCell += '<span class="score-state">Status unavailable</span>'
      + '<span class="conf-note'+(liveMode===false?" warn":"")+'">Awaiting update</span>';
  } else if(!st.score){
    scoreCell += '<span class="score-state'+(st.status==="live"?" live":"")+'">'
      + (st.status==="live"?'<span class="dot-live"></span>':"")+esc(st.label||"")+'</span>'
      + (liveMode===false
          ? '<span class="conf-note warn">Score unavailable</span>'
          : '<span class="conf-note">'+(st.status==="final"?"No score available":"No score yet")+'</span>');
  } else if(reveal){
    const sc = scoreFor(g,st);
    scoreCell += '<span class="score-line">'+sc[0]+' &ndash; '+sc[1]+'</span>'
      + (st.status==="live" ? '<span class="score-state live"><span class="dot-live"></span>'+esc(st.label)+'</span>'
                            : '<span class="score-state">'+esc(st.label)+'</span>');
  } else {
    scoreCell += '<button class="hidden-score" data-reveal="'+esc(g.id)+'">Reveal</button>'
      + (st.status==="live" ? '<span class="score-state live"><span class="dot-live"></span>Live now</span>'
                            : '<span class="score-state">'+esc(st.label||"Final")+' &middot; hidden</span>');
  }
  scoreCell += '</div>';

  const on = alerts.has(g.id);
  const bell = saveButton(g.id, on, fullName(g.home) + " v " + fullName(g.away));
  return '<div class="game'+(st.status==="live"?" is-live":"")+'">'+timeCell+'<div class="g-match">'+teams+meta+'</div>'+watch+scoreCell+bell+'</div>';
}

function daySection(key, games, now, todayKey){
  const [y,m,d] = key.split("-").map(Number);
  const diff = Math.round((new Date(y,m-1,d) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/DAY);
  let rel = key===todayKey ? "Today" : diff===1 ? "Tomorrow" : (diff>1&&diff<7) ? "In "+diff+" days" : "";
  const liveN = games.filter(g=>stateOf(g,now).status==="live").length;
  return '<section class="day"><div class="day-head"><h3>'+esc(fmtDayLong(key))+'</h3>'
    + (rel?'<span class="rel">'+esc(rel)+'</span>':'')
    + '<span class="n">'+games.length+(games.length===1?" game":" games")+(liveN?" &middot; "+liveN+" live":"")+'</span></div>'
    + '<div class="day-games">'+games.map(g=>gameRow(g,now)).join("")+'</div></section>';
}
function groupByDay(games){
  const map = new Map();
  games.forEach(g=>{ const k=localKey(g.start); if(!map.has(k)) map.set(k,[]); map.get(k).push(g); });
  return map;
}

function welcomeBanner(){
  if(!firstRun) return "";
  return '<div class="welcome"><div><b>New here? These are starter teams.</b>'
    + '<p>Vancouver, Toronto and Liverpool are loaded as an example. Swap them for your own &mdash; your picks, your services and your score setting are saved in this browser only, so they will not change anyone else\'s view.</p></div>'
    + '<div class="acts"><button class="icon-btn" id="wPick">Pick my teams</button>'
    + '<button class="x" id="wClose" aria-label="Dismiss">&times;</button></div></div>';
}

/* ---------- competition filter ---------- */
function renderFilters(){
  const comps = myComps();
  if(comps.length<2) return "";
  return '<div class="filters"><span class="lbl">Competitions</span>'
    + comps.map(c=>'<button class="fchip" data-comp="'+c+'" aria-pressed="'+(!hiddenComps.has(c))+'">'
        + '<i style="background:'+COMPS[c].color+'"></i>'+esc(COMPS[c].short)+'</button>').join("")
    + '</div>';
}

/* ---------- coverage panel ---------- */
function renderCoverage(now){
  const rep = coverageReport(now);
  if(!rep.total) return "";
  const anySet = services.size>0;
  const pctHave = rep.total ? (rep.have/rep.total*100) : 0;
  const pctMiss = rep.total ? (rep.missing/rep.total*100) : 0;
  const pctUnk  = rep.total ? (rep.unknown/rep.total*100) : 0;
  const bar = anySet
    ? '<div class="cov-bar"><i style="width:'+pctHave+'%;background:var(--ok)"></i><i style="width:'+pctMiss+'%;background:var(--warn)"></i><i style="width:'+pctUnk+'%;background:var(--line-strong)"></i></div>'
    : "";
  const sub = anySet
    ? '<b>'+rep.have+'</b> of '+rep.total+' games in the next 90 days are covered by what you have'
      + (rep.missing?' &middot; <b>'+rep.missing+'</b> need something else':'')
      + (rep.unknown?' &middot; '+rep.unknown+' with no confirmed Canadian carrier':'')
    : 'Mark what you subscribe to and every game gets flagged as watchable or not.';
  const isOpen = covOpen===null ? !anySet : covOpen;
  return '<details class="coverage"'+(isOpen?" open":"")+'><summary><span><b class="cov-h">Where your teams actually are</b>'
    + '<span class="sub">'+sub+'</span></span></summary>' + bar
    + '<div class="svc-grid">'
    + rep.services.map(s=>'<button class="svc-card" data-service="'+s.id+'" aria-pressed="'+s.owned+'">'
        + '<span class="svc-box">&#10003;</span><span><span class="svc-name">'+esc(s.label)+'</span><br>'
        + '<span class="svc-games">'+s.n+' game'+(s.n===1?"":"s")+'</span></span></button>').join("")
    + '</div>'
    + (rep.unknown ? '<div class="cov-note"><span class="pill unknown">Unconfirmed</span><span>'+rep.unknown+' fixture'+(rep.unknown===1?" has":"s have")+' no confirmed Canadian rights holder. They stay listed rather than hidden, so you know to check.</span></div>' : "")
    + '</details>';
}

/* ---------- results that already happened ---------- */
function renderResults(now, todayKey){
  // Nothing followed yet: an empty results panel would say nothing useful,
  // and the welcome banner already explains what to do.
  if(!selected.size) return "";
  const midnight = new Date(); midnight.setHours(0,0,0,0);
  const from = midnight.getTime() - 3*DAY;   // whole calendar days, so a day never appears half-shown
  // Only real fixtures can be results.
  // a finished stage has no scoreline, so races don't belong in results
  const past = myGames().filter(g=>g.start>=from && g.start<midnight.getTime()
    && (g.listed || g.espn) && !g.event).sort((a,b)=>b.start-a.start);
  if(!past.length){
    return '<details class="results"'+(resultsOpen?" open":"")+'>'
      + '<summary>Recent results<span class="conf-note">last 3 days &middot; nothing confirmed</span></summary>'
      + '<div class="results-in"><div class="note">No confirmed fixtures for your teams in the last three days. '
      + 'Real fixtures appear here as soon as the feed covers them.</div></div></details>';
  }
  const scored = past.filter(g=>{ const st=stateOf(g,now); return st.score; }).length;
  const map = new Map();
  past.forEach(g=>{ const k=localKey(g.start); if(!map.has(k)) map.set(k,[]); map.get(k).push(g); });
  let inner = "";
  map.forEach((gs,k)=>{ inner += daySection(k, gs, now, todayKey); });
  const openResults = resultsOpen===null ? !isNarrow() : resultsOpen;
  return '<details class="results"'+(openResults?" open":"")+'>'
    + '<summary>Recent results<span class="conf-note">last 3 days &middot; '
    + past.length+' game'+(past.length===1?"":"s")
    + (scored?' &middot; '+scored+' final score'+(scored===1?"":"s"):' &middot; no scores available')
    + '</span></summary><div class="results-in">'+inner+'</div></details>';
}

/* ---------- rights table ---------- */
function renderRights(){
  const comps = myComps();
  const rows = RIGHTS.filter(r=>comps.indexOf(r.comp)>=0);
  if(!rows.length) return "";
  return '<details class="rights"'+(rightsOpen?" open":"")+'><summary>Rights table &mdash; who carries what, and how sure we are</summary>'
    + '<div class="rights-wrap"><table class="rights-tbl"><thead><tr>'
    + '<th>Competition</th><th>Canada</th><th>Confidence</th><th>Note</th><th>Source</th><th>Checked</th></tr></thead><tbody>'
    + rows.map(r=>'<tr><td><b>'+esc(COMPS[r.comp].name)+'</b></td>'
        + '<td>'+(r.carriers.length ? r.carriers.map(c=>esc(c.name)).join(", ") : "&mdash;")+'</td>'
        + '<td><span class="pill '+r.confidence+'">'+r.confidence+'</span></td>'
        + '<td>'+esc(r.note)+'</td>'
        + '<td>'+(r.src&&r.src.url?'<a href="'+esc(r.src.url)+'" target="_blank" rel="noopener">'+esc(r.src.label)+'</a>':esc(r.src?r.src.label:"&mdash;"))+'</td>'
        + '<td style="white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)">'+esc(r.checked||"&mdash;")+'</td></tr>').join("")
    + '</tbody></table></div></details>';
}

function noteBlock(){
  const n = alerts.size;
  const listed = myGames().filter(g=>g.listed||g.espn).length;
  /* Tennis has its own source and its own way of being unavailable, so
     it gets its own sentence rather than being folded into the schedule
     line — a viewer following a player deserves to know the difference
     between "no matches today" and "the tennis endpoint is down and what
     you are looking at is twenty minutes old". Silent for anyone who
     follows nobody. */
  const tennisNote = () => {
    if(!players.size) return "";
    const mine = myGames().filter(g=>g.tennis).length;
    if(tennisErr){
      return '<span class="conf-note warn">Tennis: live source unreachable'
        + (tennisAt ? ', showing matches from ' + esc(agoText(tennisAt)) : ' and nothing loaded yet')
        + '</span> ';
    }
    if(!tennisAt) return '';
    return '<span class="conf-note">' + mine + ' tennis match' + (mine===1?'':'es')
      + ' for ' + players.size + ' player' + (players.size===1?'':'s')
      + ' &middot; updated ' + esc(agoText(tennisAt)) + '</span> ';
  };
  const liveLine = liveMode===true
      ? (dataStale
          ? '<b class="stale-h">Showing an older schedule.</b> The saved schedule was built <b>'
            + esc(agoText(dataAge||Date.now())) + '</b> and the live feed could not be reached, so times and '
            + 'carriers may have moved since. Nothing here is invented &mdash; it is simply old. '
          : staticCount
            ? '<b>Live scores on.</b> Fixtures come from this site\'s own schedule file, rebuilt on a schedule; anything in progress is read live. '
            : '<b>Live scores on.</b> Fixtures and scores are read live from ESPN\'s public feed. ')
        + (liveNote?'<span class="conf-note">'+liveNote+'</span> ':'')
        + (dataStale && liveErr?'<span class="conf-note warn">reason: '+esc(liveErr)+'</span> ':'')
        + tennisNote()
    : liveMode===false
      ? (myGames().some(g=>g.remembered)
          ? '<b>Showing remembered results.</b> The feed can\'t be reached right now, so scores you have already seen are being read from this browser; anything newer has no score rather than a guessed one. '
          : '<b>Scores are unavailable in this view.</b> Nothing could be fetched, so no score is shown &mdash; and none is invented. ')
        + 'Check your connection and reload; scores fill in as soon as the schedule file or the live feed can be reached. '
        + (liveErr?'<span class="conf-note warn">reason: '+esc(liveErr)+'</span> ':'')
      : '<b>Checking for live data&hellip;</b> ';
  return '<div class="note">' + liveLine
    + 'Fixtures marked <span class="pill confirmed">Listed</span> are real'
    + (listed?' &mdash; <b>'+listed+'</b> of your upcoming games right now':'')
    + '. Everything else is projected from the rights table below, which is real and sourced. '
    + 'Your teams, services and score setting are stored in this browser only &mdash; anyone else opening the same link sets up their own. '
    + (n? '<b>'+n+'</b> game'+(n===1?"":"s")+' saved in this browser.'
        : 'Save a game to mark it here &mdash; a bookmark in this browser, not a notification.')
    + '</div>';
}
function emptyState(){
  if(!selected.size)
    return '<div class="empty"><b>No teams picked yet</b>Choose your teams and their real fixtures fill in here.'
      + '<div><button class="icon-btn" id="emptyPick">Choose teams</button></div></div>';
  if(liveMode===false)
    return '<div class="empty"><b>Can\'t reach the schedule right now</b>'
      + 'Nothing real to show, and it will not invent fixtures to fill the space. Reload once you are back online.</div>';
  if(liveMode===null)
    return '<div class="empty"><b>Loading fixtures&hellip;</b>Fetching real schedules for your teams.</div>';
  return '<div class="empty"><b>Nothing scheduled</b>'
    + 'No published fixtures for your teams in the window we look at. Leagues out of season have none yet &mdash; they appear as soon as the schedule is released.'
    + '<div><button class="icon-btn" id="emptyPick">Change teams</button></div></div>';
}

function renderList(now, todayKey){
  const start = new Date(); start.setHours(0,0,0,0);
  const games = myGames().filter(g=>g.start>=start.getTime() && g.start<start.getTime()+DAY*160
    && (g.start > now - 4*3600000 || g.listed || g.espn));
  if(!games.length) return welcomeBanner()+renderFilters()+emptyState()+renderResults(now,todayKey);
  /* The schedule first. This page exists to answer what is on next and
     where it is carried, so that answer should be the first thing in
     view — service setup and past results are support, and reading
     order now says so. */
  let out = welcomeBanner() + renderFilters();
  groupByDay(games).forEach((gs,k)=>{ out += daySection(k, gs, now, todayKey); });
  return out + renderCoverage(now) + renderResults(now, todayKey) + renderRights() + noteBlock();
}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function renderCalendar(now, todayKey){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const gridStart=new Date(y,m,1-new Date(y,m,1).getDay());
  const map=groupByDay(myGames());
  const present=new Set(myGames().map(g=>g.comp));
  let head='<div class="cal-head"><button class="nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>'
    + '<button class="nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button><h3>'+MONTHS[m]+' '+y+'</h3>'
    + '<div class="cal-legend">'+Object.keys(COMPS).filter(c=>present.has(c)).map(c=>'<span><i style="background:'+COMPS[c].color+'"></i>'+esc(COMPS[c].short)+'</span>').join("")+'</div></div>';
  let grid='<div class="cal-grid">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  for(let i=0;i<42;i++){
    const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i), key=ymd(d);
    const gs=map.get(key)||[], out=d.getMonth()!==m;
    let evs=gs.slice(0,3).map(g=>{
      if(g.event){
        return '<span class="cal-ev"><i style="background:'+COMPS[g.comp].color+'"></i>'
          + esc(g.race) + '<span class="tm">'+esc((g.stage||"").replace(/^Stage /,"St "))+'</span></span>';
      }
      if(g.tennis){
        /* Surnames, not abbreviations: a player has no three-letter code,
           and "TBD @ TBD" is what reaching for one produced. */
        const m=g.match, st=TENNIS_STATE[m.status]||TENNIS_STATE.unknown;
        const last=p=>p.tbd ? "TBD" : (p.short || p.name).replace(/^[A-Z]\.\s*/,"");
        return '<span class="cal-ev"><i style="background:'+COMPS[g.comp].color+'"></i>'
          +'<span class="mu">'+esc(last(m.players[0])+" v "+last(m.players[1]))+'</span>'
          +'<span class="tm">'+(m.status==="live"?"LIVE":m.status==="final"?"FT"
             :st.live?esc(st.text):!m.timeKnown?"TBD":esc(fmtTime(g.start)))+'</span></span>';
      }
      const s=stateOf(g,now), ts=timeState(g,now);
      /* "TOR / KC" said nothing about who was at home. Conventional
         North American notation is away @ home, which reads the same way
         on every scoreboard. */
      const away = ts.state==="tbd" ? null : g.away, home = g.home;
      const matchup = esc(away?away.abbr:"TBD") + " @ " + esc(home?home.abbr:"TBD");
      return '<span class="cal-ev"><i style="background:'+COMPS[g.comp].color+'"></i>'
        +'<span class="mu">'+matchup+'</span>'
        +'<span class="tm">'+(s.status==="live"?"LIVE":s.status==="final"?"FT":ts.state==="tbc"||ts.state==="tbd"?"TBC":esc(fmtTime(g.start)))+'</span></span>';
    }).join("");
    if(gs.length>3) evs+='<span class="cal-more">+'+(gs.length-3)+' more</span>';
    /* The visible cell is a number and a few abbreviations, which does
       not read as a date. Name it in full, state whether it is today,
       and expose the selection rather than leaving it to the outline. */
    const label = fmtDayLong(key) + (gs.length ? ", " + gs.length + (gs.length===1?" game":" games") : ", no games");
    grid+='<button class="cal-cell'+(out?" out":"")+(key===todayKey?" today":"")+(key===selDay?" sel":"")+'"'
      +' data-day="'+key+'" aria-label="'+esc(label)+'"'
      +' aria-pressed="'+(key===selDay)+'" aria-controls="calDetail"'
      +(key===todayKey?' aria-current="date"':'')+'>'
      +'<span class="cal-num" aria-hidden="true"><b>'+d.getDate()+'</b></span>'+evs+'</button>';
  }
  grid+='</div>';
  let detail;
  if(selDay){
    const gs=map.get(selDay)||[];
    detail='<div class="cal-detail" id="calDetail" role="region" aria-live="polite" aria-label="Selected day">'+(gs.length?daySection(selDay,gs,now,todayKey)
      :'<section class="day"><div class="day-head"><h3>'+esc(fmtDayLong(selDay))+'</h3><span class="n">No games</span></div></section>')+'</div>';
  } else detail='<div class="cal-detail" id="calDetail" role="region" aria-live="polite" aria-label="Selected day"><div class="note">Pick a day to see start times, scores and where each game is carried.</div></div>';
  return welcomeBanner()+renderFilters()+head+grid+detail;
}

/* Who is playing, whatever the sport. The rail and the "next up" line
   both needed this: reaching for home and away gave tennis "TBD v TBD",
   because a match has neither. */
function matchupLabel(g){
  if(g.tennis) return g.match.players.map(p=>p.name).join(" v ");
  if(g.event) return g.race || "";
  const o = orderedTeams(g);
  return fullName(o.a) + " " + o.sep + " " + fullName(o.b);
}
/* Defensive on the optional parts of the contract. The page and the
   endpoint deploy together, but a browser holding a cached page while a
   new endpoint answers it — or the reverse — is a real state, and an
   older answer missing a field must not throw the whole render away. */
const setsWon = (m, i) => (m.setWins || []).filter(w => w === i).length;

function renderRail(now, todayKey){
  const el=document.getElementById("rail");
  const today=myGames().filter(g=>localKey(g.start)===todayKey);
  // live first — read from the match for tennis, which has no home side
  // for stateOf() to reason about
  const rankOf = g => g.tennis
    ? (g.match.status==="live"||g.match.status==="suspended" ? 0 : g.match.status==="scheduled" ? 1 : 2)
    : (st=>st==="live"?0:st==="scheduled"?1:2)(stateOf(g,now).status);
  today.sort((a,b)=>rankOf(a)-rankOf(b)||a.start-b.start);
  const label='<div class="rail-label"><b>Today</b><span>'+esc(fmtDayLong(todayKey))+'</span></div>';
  if(!today.length){
    const next=myGames().find(g=>g.start>now);
    el.innerHTML=label+(next
      ? '<div class="rail-empty">Nothing on today. Next up: '
        + '<b>'+esc(matchupLabel(next))+'</b>'
        + ' &middot; ' + esc(fmtDayLong(localKey(next.start)))
        + ' &middot; <span class="countdown" data-start="'+next.start+'">'+esc(countdownText(next.start,now))+'</span></div>'
      : '<div class="rail-empty">Nothing on today.</div>');
    return;
  }
  /* One unrenderable card must not leave the whole rail showing whatever
     it happened to say before. */
  const card = g => { try{ return railCard(g, now); }catch(e){ return ""; } };
  el.innerHTML=label+'<div class="rail-scroll">'+today.map(card).join("")+'</div>';
}
function railCard(g, now){
  {
    if(g.event){
      const r=resolveRights(g);
      return '<div class="rail-card"><div class="rail-row"><span class="t">'+esc(g.race)+'</span></div>'
        + '<div class="rail-row"><span class="t" style="color:var(--panel-muted)">'+esc(g.stage||"")+'</span></div>'
        + '<div class="rail-meta"><span class="dot-live"></span>Racing today<span>&middot;</span><span>'
        + esc(r.carriers.length?r.carriers[0].name:"TBC")+'</span></div></div>';
    }
    if(g.tennis){
      /* A card of its own. Sets won per player is a real tennis number —
         ESPN says who took each set — where a single scoreline would not
         be. The set-by-set line stays on the row in the list. */
      const m=g.match, r=resolveRights(g), stt=TENNIS_STATE[m.status]||TENNIS_STATE.unknown;
      const reveal=showScores||revealed.has(g.id);
      const played=(m.sets||[]).some((_,i)=>setText(m,i));
      const line=i=>'<div class="rail-row"><span class="t">'+esc(m.players[i].short||m.players[i].name)+'</span>'
        +'<span class="s">'+(m.status==="scheduled"?"&nbsp;":!played?"&ndash;":reveal?setsWon(m,i):"&bull;")+'</span></div>';
      const meta=stt.live?'<span class="dot-live"></span>'+esc(m.label||stt.text)
        : m.status==="scheduled"?esc(m.timeKnown?fmtTime(g.start):"Time TBD") : esc(stt.text);
      return '<div class="rail-card">'+line(0)+line(1)
        +'<div class="rail-meta">'+meta+'<span>&middot;</span><span>'
        +esc(r.carriers.length?r.carriers[0].name:"TBD")+'</span></div></div>';
    }

    const s=stateOf(g,now), o=orderedTeams(g), rights=resolveRights(g);
    const reveal=showScores||revealed.has(g.id), sc=s.score?scoreFor(g,s):null;
    const line=(t,first)=>'<div class="rail-row"><span class="t">'+esc(fullName(t))+'</span><span class="s">'
      +(s.status==="scheduled"?"&nbsp;":!sc?"&ndash;":reveal?(first?sc[0]:sc[1]):"&bull;")+'</span></div>';
    const meta=s.status==="live"?'<span class="dot-live"></span>'+esc(s.label):s.status==="final"?"Final":esc(fmtTime(g.start));
    return '<div class="rail-card">'+line(o.a,true)+line(o.b,false)
      +'<div class="rail-meta">'+meta+'<span>&middot;</span><span>'+esc(rights.carriers.length?rights.carriers[0].name:"TBC")+'</span></div></div>';
  }
}

function renderDrawer(){
  const q=search.trim().toLowerCase();
  const groups=Object.keys(COMPS).map(lg=>{
    const ts=pickable.filter(t=>t.home===lg && (!q||(t.city+" "+t.name+" "+t.abbr).toLowerCase().includes(q)));
    if(!ts.length) return "";
    return '<div class="lg-group"><div class="lg-title"><b>'+esc(COMPS[lg].name)+'</b><span class="bar"></span></div><div class="chips">'
      + ts.map(t=>'<button class="chip" data-team="'+t.id+'" aria-pressed="'+selected.has(t.id)+'" title="'+esc(t.comps.map(c=>COMPS[c].short).join(" · "))+'">'
          + crest(t)+esc(fullName(t))
          + (t.comps.length>1?'<span style="font-family:var(--mono);font-size:9.5px;opacity:.65">'+t.comps.length+' comps</span>':'')
          + '</button>').join("")+'</div></div>';
  }).join("");
  document.getElementById("teamGroups").innerHTML = (groups||'<div class="empty">No teams match &ldquo;'+esc(search)+'&rdquo;</div>')
    + playerPicker(q)
    + '<div class="lg-group"><div class="lg-title"><b>Your link</b><span class="bar"></span></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + '<input class="search" id="shareBox" readonly style="margin:0;flex:1;min-width:240px" value="'+esc(shareLink())+'">'
    + '<button class="icon-btn" id="copyLink">Copy</button>'
    + '<span style="font-size:12px;color:var(--muted)">Opens with your teams already picked, then tidies itself out of their address bar. Everyone else keeps their own.</span></div></div>';
  // textContent, so the separator is the character rather than an entity
  document.getElementById("drawerCount").textContent = selected.size+" selected"
    + (players.size ? " \u00b7 "+players.size+" player"+(players.size===1?"":"s") : "");
}

/* Tennis is followed by player, so the picker needs a search rather than
   a grid: there are a few hundred singles players in the draws at any
   time and listing them all would be a wall of names. Type to find one;
   with nothing typed, only the players already followed are shown, so
   the section is empty and quiet for someone who does not want tennis.

   The list travels with the schedule file, so searching costs no request
   and works with the tennis endpoint unreachable. */
const PLAYER_LIMIT = 30;
function playerPicker(q){
  const chosen = PLAYER_DIR.filter(r=>players.has(r[0]));
  /* An id followed from a share link but missing from the list — the
     player is out of the draws this week — is still shown, so it can be
     seen and removed rather than silently persisting. */
  const known = new Set(PLAYER_DIR.map(r=>r[0]));
  const orphans = [...players].filter(id=>!known.has(id)).map(id=>[id, "Player "+id, "", ""]);
  let show, note;
  if(q){
    const hits = PLAYER_DIR.filter(r=>normName(r[1]).indexOf(normName(q))>=0);
    show = hits.slice(0, PLAYER_LIMIT);
    note = hits.length > PLAYER_LIMIT
      ? (hits.length - PLAYER_LIMIT)+" more match &mdash; keep typing"
      : hits.length ? "" : "No player matches &ldquo;"+esc(q)+"&rdquo;";
  } else {
    show = chosen.concat(orphans);
    note = PLAYER_DIR.length
      ? (show.length ? "" : "Search a name to follow a player &mdash; "+PLAYER_DIR.length+" in the current draws")
      : "The player list arrives with the schedule file.";
  }
  const chip = r => '<button class="chip" data-player="'+esc(r[0])+'" aria-pressed="'+players.has(r[0])+'">'
    + esc(r[1])
    + (r[3] ? '<span style="font-family:var(--mono);font-size:9.5px;opacity:.65">'+esc(r[3])+'</span>' : "")
    + (r[2] ? '<span style="font-family:var(--mono);font-size:9.5px;opacity:.65">'+esc(r[2])+'</span>' : "")
    + '</button>';
  return '<div class="lg-group"><div class="lg-title"><b>Tennis players</b><span class="bar"></span>'
    + '<span style="font-family:var(--mono);font-size:10px;color:var(--muted)">ATP &middot; WTA singles</span></div>'
    + (show.length ? '<div class="chips">'+show.map(chip).join("")+'</div>' : "")
    + (note ? '<div class="empty" style="margin-top:6px">'+note+'</div>' : "")
    + '</div>';
}

/* ============================ render + events ============================ */
function render(){
  const now=Date.now(), todayKey=ymd(new Date(now));
  const main = document.getElementById("main");
  /* This runs every thirty seconds. Replacing the subtree throws away
     whatever the keyboard was on, which on a page of buttons means focus
     silently returns to the document while someone is part-way through
     it. Note where focus was and put it back afterwards. */
  const active = document.activeElement;
  const focusKey = active && main.contains(active)
    ? (active.getAttribute("data-day") ? "day:" + active.getAttribute("data-day")
      : active.getAttribute("data-alert") ? "alert:" + active.getAttribute("data-alert")
      : active.getAttribute("data-comp") ? "comp:" + active.getAttribute("data-comp")
      : active.getAttribute("data-service") ? "service:" + active.getAttribute("data-service")
      : active.getAttribute("data-reveal") ? "reveal:" + active.getAttribute("data-reveal")
      : active.id ? "id:" + active.id : null)
    : null;
  main.innerHTML = view==="list"?renderList(now,todayKey):renderCalendar(now,todayKey);
  if(focusKey){
    const [kind, val] = [focusKey.slice(0, focusKey.indexOf(":")), focusKey.slice(focusKey.indexOf(":")+1)];
    const attr = {day:"data-day", alert:"data-alert", comp:"data-comp", service:"data-service", reveal:"data-reveal"}[kind];
    let el = null;
    try{ el = kind==="id" ? main.querySelector("#"+CSS.escape(val))
                          : main.querySelector("["+attr+'="'+CSS.escape(val)+'"]'); }catch(e){}
    if(el) el.focus();
  }
  renderRail(now,todayKey);
  document.getElementById("teamCount").textContent=selected.size+(players.size?"+"+players.size:"");
  document.getElementById("v-list").setAttribute("aria-pressed",view==="list");
  document.getElementById("v-cal").setAttribute("aria-pressed",view==="calendar");
  const stg=document.getElementById("scoreToggle");
  stg.setAttribute("aria-pressed",showScores);
  document.getElementById("scoreToggleLabel").textContent=showScores?"Scores on":"Scores hidden";
  const cov=document.querySelector(".coverage");
  if(cov) cov.addEventListener("toggle",()=>{ covOpen=cov.open; });
  const rt=document.querySelector(".rights");
  if(rt) rt.addEventListener("toggle",()=>{ rightsOpen=rt.open; });
  const rs=document.querySelector(".results");
  if(rs) rs.addEventListener("toggle",()=>{ resultsOpen=rs.open; });
  stg.querySelector("svg").innerHTML = showScores
    ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.3 6.4A16.7 16.7 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
}
const drawer=document.getElementById("drawer");
document.getElementById("v-list").addEventListener("click",()=>{view="list";render();});
document.getElementById("v-cal").addEventListener("click",()=>{view="calendar"; if(!selDay) selDay=ymd(new Date()); calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1); render();});
document.getElementById("scoreToggle").addEventListener("click",()=>{showScores=!showScores; if(showScores) revealed.clear(); persist(); render();});
document.getElementById("teamsToggle").addEventListener("click",function(){
  if(firstRun){ firstRun=false; LS.set("gdn.seen",true); render(); }
  const open=drawer.hasAttribute("hidden");
  if(open){ drawer.removeAttribute("hidden"); renderDrawer(); } else drawer.setAttribute("hidden","");
  this.setAttribute("aria-pressed",open);
});
document.getElementById("teamSearch").addEventListener("input",function(){search=this.value;renderDrawer();});
document.getElementById("teamGroups").addEventListener("click",function(e){
  const b=e.target.closest("[data-team]");
  if(b){ const id=b.getAttribute("data-team"); selected.has(id)?selected.delete(id):selected.add(id);
    persist(); renderDrawer(); render(); refreshAfterPicks(); return; }
  const pb=e.target.closest("[data-player]");
  if(pb){ const id=pb.getAttribute("data-player"); players.has(id)?players.delete(id):players.add(id);
    persist(); renderDrawer(); render(); refreshAfterPicks(); return; }
  if(e.target.closest("#copyLink")){
    const box=document.getElementById("shareBox");
    box.select();
    try{ navigator.clipboard.writeText(box.value); }catch(err){ try{ document.execCommand("copy"); }catch(e2){} }
    const btn=e.target.closest("#copyLink"); btn.textContent="Copied"; setTimeout(()=>{btn.textContent="Copy";},1400);
  }
});
document.getElementById("main").addEventListener("click",function(e){
  const rev=e.target.closest("[data-reveal]"); if(rev){ revealed.add(rev.getAttribute("data-reveal")); render(); return; }
  const al=e.target.closest("[data-alert]"); if(al){ const id=al.getAttribute("data-alert"); alerts.has(id)?alerts.delete(id):alerts.add(id); persist(); render(); return; }
  const sv=e.target.closest("[data-service]"); if(sv){ const id=sv.getAttribute("data-service"); services.has(id)?services.delete(id):services.add(id); persist(); render(); return; }
  const cp=e.target.closest("[data-comp]"); if(cp){ const id=cp.getAttribute("data-comp"); hiddenComps.has(id)?hiddenComps.delete(id):hiddenComps.add(id); persist(); render(); return; }
  const day=e.target.closest("[data-day]"); if(day){ selDay=day.getAttribute("data-day"); render(); return; }
  if(e.target.closest("#prevMonth")){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); return; }
  if(e.target.closest("#nextMonth")){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); return; }
  if(e.target.closest("#wClose")){ firstRun=false; LS.set("gdn.seen",true); render(); return; }
  if(e.target.closest("#emptyPick")||e.target.closest("#wPick")){
    firstRun=false; LS.set("gdn.seen",true);
    drawer.removeAttribute("hidden"); renderDrawer();
    document.getElementById("teamsToggle").setAttribute("aria-pressed",true);
    render();
  }
});
setInterval(()=>{ const now=Date.now(); document.querySelectorAll(".countdown[data-start]").forEach(el=>{ el.textContent=countdownText(Number(el.getAttribute("data-start")),now); }); },1000);
setInterval(render,30000);

/* Prefer the committed file; fall back to talking to the API directly
   when it is missing or has gone stale, so a stalled job degrades into
   the old behaviour rather than an empty page. */
// Generous, because the file carries fixtures rather than scores: those
// barely move, and anything in progress is topped up live regardless. A
// short window would only push every visitor back to fetching directly.
const STALE_AFTER = 12*60*60*1000;
/* Freshness and reachability are different questions, and conflating them
   produced a page that held a complete schedule and 60-odd scores while
   announcing "Nothing could be fetched". What we hold, how old it is, and
   whether the live source answered are tracked apart from each other. */
let dataAge = null;     // when the data we are showing was built, or null
let dataStale = false;  // we are showing it, but it is older than we trust silently
let liveOK = null;      // did the live source answer this cycle

/* One refresh at a time. The minute poll, the quarter-hour poll, the
   picker and a tab coming back into view can all ask at once; letting
   them interleave means two passes writing the same fixtures from
   responses that arrived out of order, which can put an older score
   back. A caller that asks while one is running joins it rather than
   starting a second. */
let refreshing = null;
function refreshLive(){
  if(refreshing) return refreshing;
  refreshing = runRefresh().finally(()=>{ refreshing = null; });
  return refreshing;
}
async function runRefresh(){
  let held = 0;
  try{ held = await loadStatic(); }catch(e){ held = 0; }
  const fresh = held > 0 && staticAt && (Date.now() - staticAt) < STALE_AFTER;
  if(held > 0){
    liveMode = true; liveErr = "";
    dataAge = staticAt || null;
    dataStale = !fresh;
    rememberResults(); render();
  }
  if(fresh){
    // one cheap top-up for anything in progress, then done
    let filled = 0;
    try{ filled = await fillScores(); liveOK = true; }catch(e){ liveOK = false; }
    if(filled){ rememberResults(); }
    liveNote = staticCount + " fixture" + (staticCount===1?"":"s") + " from the schedule file"
      + (filled ? ", " + filled + " score" + (filled===1?"":"s") + " live" : "")
      + " &middot; updated " + agoText(staticAt);
    render();
    return;
  }
  try{
    await loadLive();
    liveMode = true; liveErr = ""; liveOK = true;
    dataStale = false; dataAge = Date.now();
    rememberResults(); render();
  }catch(e){
    liveOK = false;
    liveErr = (e && e.message || String(e)).slice(0,120);
    /* Holding a stale schedule is not the same as holding nothing. Keep
       it, and say plainly how old it is; only with nothing at all is the
       page genuinely unable to answer. */
    if(held > 0){ liveMode = true; dataStale = true; }
    else { liveMode = false; dataAge = null; dataStale = false; }
    render();
  }
}
function agoText(ms){
  const m = Math.max(0, Math.round((Date.now()-ms)/60000));
  if(m < 1) return "just now";
  if(m < 60) return m + " min ago";
  const h = Math.round(m/60);
  return h + (h===1?" hour ago":" hours ago");
}
/* Tennis refreshes on its own loop and behind its own lock. It is a
   different endpoint answering a different question, and the team and
   cycling paths are deliberately untouched by any of it: a viewer who
   follows no players never reaches this code, and a viewer who follows
   several never slows their hockey down.

   A failure here is not an emptying. loadTennis() only replaces the rows
   once it has an answer, so a refusal from the endpoint leaves the last
   good matches exactly where they were, and the age of them is shown
   rather than passed off as current. */
let tennisRefreshing = null;
function refreshTennis(only){
  if(tennisRefreshing) return tennisRefreshing;
  tennisRefreshing = loadTennis(only)
    .then(n=>{ tennisErr = ""; render(); return n; })
    .catch(e=>{ tennisErr = (e && e.message || String(e)).slice(0,120); render(); return 0; })
    .finally(()=>{ tennisRefreshing = null; });
  return tennisRefreshing;
}
/* The whole tennis polling policy:
     · nobody followed, no request — ever
     · only while scores are on, as with every other live number here
     · every 60s while a followed player has a match that is live,
       suspended, or past its start and unresolved
     · only the tours that match is actually in
     · nothing once the source calls it final, retired, walkover or
       otherwise complete
     · nothing while the tab is hidden; one refresh when it returns */
function tennisPollDue(){
  if(!players.size || !showScores) return false;
  const now = Date.now();
  return GAMES.some(g=>g.tennis && isMine(g) && tennisActive(g.match, now));
}

/* Picking a team should fill its fixtures in straight away rather than
   leaving a blank until the next cycle. Debounced so working through
   the picker fires one fetch, not one per click. */
let pickTimer = null;
function refreshAfterPicks(){
  clearTimeout(pickTimer);
  pickTimer = setTimeout(()=>{
    if(selected.size) refreshLive();
    if(players.size) refreshTennis(false);
    else if(GAMES.some(g=>g.tennis)) refreshTennis(false);   // unfollowed the last player
  }, 700);
}
recallResults();   // put last week's known finals on screen before any network call
refreshLive();
if(players.size) refreshTennis(false);
setInterval(()=>{
  if(document.hidden) return;
  if(tennisPollDue()) refreshTennis(true);   // true: only the tours with a match on
}, 60000);
/* Slower sweep for the rest of it — a draw moves on, a walkover is
   announced, tomorrow's order of play appears. Only when someone is
   actually being followed. */
setInterval(()=>{ if(players.size) refreshTennis(false); }, 15*60000);
/* ---- the minute poll ------------------------------------------------
   The whole policy, in one place:

     · only fixtures involving a followed team, and only while scores are
       on — with them off there is no number on screen to keep current
     · every 60s while something is active or its status is unknown, which
       covers halftime, a delay, extra time, overtime and a shootout,
       because ESPN reports every one of those as state "in"
     · nothing once ESPN has said completed or "post"; the scheduled
       rebuild of data.json carries the rare post-final correction
     · nothing while the tab is hidden, and one refresh the moment it
       comes back, since an unknown amount of the game happened meanwhile

   Cycling is never polled here: a stage has no opponent and no ESPN
   path, so needsScore() declines it before any of this is reached.
   -------------------------------------------------------------------- */
function pollDue(){
  if(liveMode === false || !showScores) return false;
  const now = Date.now();
  return myGames().some(g => activeNow(g, now));
}
setInterval(()=>{
  if(document.hidden) return;        // paused with the tab, not merely quiet
  if(pollDue()) refreshLive();
}, 60000);
document.addEventListener("visibilitychange", ()=>{
  /* Coming back deserves a refresh whether or not scores are on: the
     fixtures, the live badges and the carrier notes are all as old as
     the time spent away. This is one request on return, not a poll. */
  if(document.hidden) return;
  if(liveMode !== false) refreshLive();
  if(players.size) refreshTennis(false);
});
setInterval(()=>{ if(liveMode!==false) refreshLive(); }, 15*60000);
if(!selected.size){ drawer.removeAttribute("hidden"); document.getElementById("teamsToggle").setAttribute("aria-pressed",true); }
persist(); renderDrawer(); render();
})();
</script>
