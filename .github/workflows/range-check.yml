name: Range still covers its span

# scripts/fetch-data.mjs asks for a competition's whole window in one
# ranged request, and falls back to one request per day when ESPN refuses
# the range. The range has behaved three ways: a YYYYMMDD-YYYYMMDD request
# once returned the first day only, on 9 Sep 2026 it returned the whole
# span, and on 15 Sep 2026 it began answering HTTP 400 on every league.
#
# If the range truncates again, a league silently loses everything past
# its first day; if it errors, the build is on the expensive per-day
# plan. The per-competition floor in the build would catch the first on
# the next run, but it would report a collapsed league rather than the
# reason, and nothing in the build reports the second beyond a log line.
# This says the reason, directly, the night it happens — and an HTTP
# error on the ranged request is a failure here, not a skipped check.
#
# Eight small requests. Deliberately not part of the fixture build, so a
# check failing never stops fixtures being published.

on:
  schedule:
    - cron: "10 6 * * *"          # daily, well clear of the refresh slots
  workflow_dispatch:
  push:
    paths:
      - "scripts/check-range.mjs"
      - ".github/workflows/range-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node scripts/check-range.mjs
