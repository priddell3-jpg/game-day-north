name: Tests

# The parsing rules in this repo are the kind that fail silently: a bad
# regex returns a plausible name rather than an error, and a fixed
# timezone offset is wrong for only part of the year. Run them against
# saved real inputs on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"          # the scheduled refresh commits this; it changes no logic
  # Every pull request, draft included. The activity types are named
  # rather than left to the default because the default set omits
  # ready_for_review: without it, a draft opened before its last commit
  # and then marked ready would never be tested at the moment someone
  # actually asked for review.
  #
  # Worth knowing, because it cost an afternoon: a pull request whose
  # branch conflicts with its base runs none of this. These jobs run
  # against the merge of head into base, and a conflicted pull request has
  # no such merge to check out, so GitHub starts no run at all — silently,
  # with no failed check to notice. A pull request showing no tests is
  # worth checking for conflicts before suspecting the triggers.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run tests
        # The glob rather than the directory: `node --test tests/` works on
        # node 20 and fails on 22 with MODULE_NOT_FOUND, because the
        # directory form changed underneath it. Naming the files works on
        # both and says exactly what is being run.
        run: node --test tests/*.test.mjs
