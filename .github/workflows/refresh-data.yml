name: Refresh fixtures

# One machine talks to the sports API on a schedule and commits the
# result, so visitors read a file from this repo instead of each of them
# calling an undocumented endpoint from their own browser.
on:
  schedule:
    # Every three hours. The file carries fixtures, which barely move;
    # anything in progress is read live by the page itself, so a tighter
    # schedule would buy nothing but bot commits.
    - cron: "20 */3 * * *"
  workflow_dispatch:             # and on demand from the Actions tab
  push:
    paths:
      # scripts/** rather than the entry point alone: the build now
      # imports helpers from scripts/lib, and a change there would
      # otherwise ship without a run proving it still builds.
      - "scripts/**"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data.json
        run: node scripts/fetch-data.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No fixture changes."
            exit 0
          fi
          # Only main gets a commit. This job also runs on a branch push
          # that touches scripts/**, which is deliberate — it proves the
          # build still works before the change is merged — but committing
          # there put bot commits on feature branches and left a pull
          # request's head as a commit made with GITHUB_TOKEN, which by
          # design triggers no workflow of its own and so arrives untested.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Built cleanly on ${GITHUB_REF}; leaving data.json to main."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh fixtures — $(node -e 'const d=require("./data.json");process.stdout.write(d.counts.fixtures+" fixtures, "+d.counts.withScore+" with scores")')"
          git push
