name: Refresh fixtures

# One machine talks to the sports API on a schedule and commits the
# result, so visitors read a file from this repo instead of each of them
# calling an undocumented endpoint from their own browser.
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (GitHub may delay under load)
  workflow_dispatch:             # and on demand from the Actions tab
  push:
    paths:
      - "scripts/fetch-data.mjs"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data.json
        run: node scripts/fetch-data.mjs

      - name: Commit if anything changed
        run: |
          # a brand-new data.json is untracked, and git diff ignores untracked
          # files — record the intent to add so the first run is seen as a change
          git add -N data.json
          if git diff --quiet -- data.json; then
            echo "No fixture changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh fixtures — $(node -e 'const d=require("./data.json");process.stdout.write(d.counts.fixtures+" fixtures, "+d.counts.withScore+" with scores")')"
          git push
