<title>Game Day North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F8;
  --surface:#FFFFFF;
  --surface-2:#F7F8FC;
  --ink:#0C1120;
  --ink-2:#2A3346;
  --muted:#68738C;
  --line:#DCE2EE;
  --line-strong:#C3CBDC;
  --accent:#1F3BE0;
  --accent-soft:#E5E9FD;
  --live:#DC1B33;
  --live-soft:#FCE7EA;
  --panel:#0C1120;
  --panel-ink:#EEF1F8;
  --panel-muted:#7C88A3;
  --panel-line:#232C42;
  --shadow:0 1px 2px rgba(12,17,32,.06), 0 8px 24px -16px rgba(12,17,32,.28);
  --radius:10px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080B14;
    --surface:#121828;
    --surface-2:#0E1421;
    --ink:#E8ECF7;
    --ink-2:#C3CBDC;
    --muted:#8590A9;
    --line:#212A3D;
    --line-strong:#2E3950;
    --accent:#7B90FF;
    --accent-soft:#1A2247;
    --live:#FF5E72;
    --live-soft:#3A1520;
    --panel:#03060E;
    --panel-ink:#E8ECF7;
    --panel-muted:#78849E;
    --panel-line:#1A2233;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#080B14;
  --surface:#121828;
  --surface-2:#0E1421;
  --ink:#E8ECF7;
  --ink-2:#C3CBDC;
  --muted:#8590A9;
  --line:#212A3D;
  --line-strong:#2E3950;
  --accent:#7B90FF;
  --accent-soft:#1A2247;
  --live:#FF5E72;
  --live-soft:#3A1520;
  --panel:#03060E;
  --panel-ink:#E8ECF7;
  --panel-muted:#78849E;
  --panel-line:#1A2233;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--display);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{
  width:28px;height:28px;flex:none;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-family:var(--mono);
  font-size:12px;font-weight:600;letter-spacing:-.5px;
}
.brand-name{font-weight:800;font-stretch:118%;letter-spacing:-.2px;font-size:16px;white-space:nowrap}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,background .15s;
}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.eye{width:15px;height:15px;flex:none}

/* ---------- scoreboard rail ---------- */
.rail{background:var(--panel);color:var(--panel-ink);border-bottom:1px solid var(--line-strong);box-shadow:inset 0 -1px 0 var(--panel-line)}
.rail-in{display:flex;align-items:stretch;gap:0;min-height:64px}
.rail-label{
  flex:none;display:flex;flex-direction:column;justify-content:center;padding:10px 18px 10px 0;
  border-right:1px solid var(--panel-line);margin-right:16px;
}
.rail-label b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--panel-muted);font-weight:500}
.rail-label span{font-weight:800;font-stretch:118%;font-size:15px;letter-spacing:-.2px}
.rail-scroll{display:flex;gap:0;overflow-x:auto;flex:1;scrollbar-width:thin}
.rail-card{
  flex:none;min-width:186px;padding:11px 18px 11px 0;margin-right:18px;
  border-right:1px solid var(--panel-line);display:flex;flex-direction:column;gap:3px;justify-content:center;
}
.rail-card:last-child{border-right:none}
.rail-row{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12.5px}
.rail-row .t{flex:1;color:var(--panel-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-row .s{font-weight:600;font-variant-numeric:tabular-nums}
.rail-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-muted);display:flex;gap:7px;align-items:center}
.rail-empty{display:flex;align-items:center;color:var(--panel-muted);font-size:13.5px;padding:12px 0}
.rail-empty b{color:var(--panel-ink);font-weight:700}

/* ---------- live dot ---------- */
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}

/* ---------- teams drawer ---------- */
.drawer{border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-in{padding:18px 0 20px}
.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.drawer-head h2{margin:0;font-size:14px;font-weight:800;font-stretch:118%;letter-spacing:-.1px}
.drawer-head .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
.search{
  margin-left:auto;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  font:inherit;font-size:13px;color:var(--ink);min-width:180px;
}
.search::placeholder{color:var(--muted)}
.lg-group{margin-bottom:14px}
.lg-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lg-title b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lg-title .bar{height:1px;flex:1;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,background .15s,color .15s;
}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.crest{
  width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:8.5px;font-weight:600;color:#fff;letter-spacing:-.3px;
}

/* ---------- day sections ---------- */
main{padding:22px 0 80px}
.day{margin-bottom:26px}
.day-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.day-head h3{margin:0;font-size:17px;font-weight:800;font-stretch:120%;letter-spacing:-.3px;text-transform:uppercase}
.day-head .rel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.day-head .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- game row ---------- */
.game{
  display:grid;
  grid-template-columns:74px 1fr auto auto 34px;
  gap:16px;align-items:center;
  padding:13px 14px 13px 12px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  border-left:3px solid transparent;
  transition:background .15s;
}
.day-games{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;background:var(--surface)}
.game:last-child{border-bottom:none}
.game:hover{background:var(--surface-2)}
.game.is-live{border-left-color:var(--live);background:linear-gradient(90deg,var(--live-soft),var(--surface) 55%)}
.g-time{font-family:var(--mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.g-time .ap{font-size:10px;color:var(--muted);margin-left:2px}
.g-time .moved{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--live);margin-top:2px}
.g-time .was{display:block;font-size:10px;color:var(--muted);text-decoration:line-through}
.g-match{min-width:0;display:flex;flex-direction:column;gap:4px}
.g-teams{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g-team{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;letter-spacing:-.15px;white-space:nowrap}
.g-team.dim{font-weight:500;color:var(--ink-2)}
.at{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.g-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.lg-tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;padding:2px 6px;border-radius:4px;color:#fff}
.g-watch{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.svc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.svc .pip{width:5px;height:5px;border-radius:1px;background:var(--muted);flex:none}
.svc.tv .pip{background:var(--accent);border-radius:1px}
.svc.stream .pip{background:var(--ink-2);border-radius:50%}
.svc-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g-score{min-width:88px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.score-line{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.score-state{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.score-state.live{color:var(--live);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.hidden-score{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px dashed var(--line-strong);border-radius:6px;padding:4px 9px;color:var(--muted);
  transition:border-color .15s,color .15s;
}
.hidden-score:hover{border-color:var(--accent);color:var(--accent)}
.countdown{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bell{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}
.bell:hover{background:var(--surface-2);border-color:var(--line)}
.bell[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.bell svg{width:15px;height:15px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;font-weight:800;font-stretch:115%;color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head h3{margin:0;font-size:19px;font-weight:800;font-stretch:120%;letter-spacing:-.4px;text-transform:uppercase}
.nav-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2)}
.nav-btn:hover{border-color:var(--line-strong)}
.cal-legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:var(--surface-2);padding:7px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.cal-cell{background:var(--surface);min-height:96px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;border:none;border-radius:0}
.cal-cell.out{background:var(--surface-2);color:var(--muted)}
.cal-cell:hover{background:var(--accent-soft)}
.cal-cell.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.cal-num{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;align-items:center;gap:5px}
.cal-cell.today .cal-num b{background:var(--live);color:#fff;border-radius:4px;padding:0 4px}
.cal-num b{font-weight:600;color:var(--ink)}
.cal-cell.out .cal-num b{color:var(--muted)}
.cal-ev{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.cal-ev i{width:6px;height:6px;border-radius:50%;flex:none}
.cal-ev .tm{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:9.5px}
.cal-more{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:auto}
.cal-detail{margin-top:20px}
.cal-detail .day-head{border-bottom-width:2px}

/* ---------- footer note ---------- */
.note{
  margin-top:26px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);background:var(--surface);font-size:13px;color:var(--ink-2);
}
.note b{font-weight:800;font-stretch:112%}
.note code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .brand-sub{display:none}
  .topbar-in{height:auto;padding:10px 0;flex-wrap:wrap;gap:8px}
  .game{grid-template-columns:64px 1fr auto;gap:10px;padding:12px 8px 12px 10px}
  .g-watch{grid-column:2/4;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:10px}
  .g-score{grid-column:3;grid-row:1;min-width:0}
  .bell{grid-column:3;grid-row:1;justify-self:end;display:none}
  .cal-cell{min-height:70px}
  .cal-ev .tm{display:none}
  .rail-label{display:none}
}

/* ---------- v2: coverage, confidence, competitions ---------- */
:root{ --ok:#0F7A52; --ok-soft:#E3F3EC; --warn:#9A5B00; --warn-soft:#FBF0DC; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ok:#4FD1A0; --ok-soft:#0E2C22; --warn:#E8B45E; --warn-soft:#2E2210; } }
:root[data-theme="dark"]{ --ok:#4FD1A0; --ok-soft:#0E2C22; --warn:#E8B45E; --warn-soft:#2E2210; }

.welcome{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;margin:18px 0 4px;
  border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius)}
.welcome b{display:block;font-size:14px;font-weight:800;font-stretch:115%;margin-bottom:2px}
.welcome p{margin:0;font-size:13px;color:var(--ink-2);max-width:62ch}
.welcome .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.welcome .x{color:var(--muted);font-size:16px;line-height:1;padding:4px 6px}
@media (max-width:760px){ .welcome{flex-wrap:wrap} .welcome .acts{margin-left:0;width:100%} }
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 4px}
.filters .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.fchip i{width:7px;height:7px;border-radius:50%;flex:none;opacity:.35}
.fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--line-strong)}
.fchip[aria-pressed="true"] i{opacity:1}

.coverage{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:22px}
.coverage summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.coverage summary::-webkit-details-marker{display:none}
.coverage summary::after{content:"\25BE";margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s;padding-left:10px}
.coverage[open] summary::after{transform:rotate(180deg)}
.cov-h{display:block;font-size:15px;font-weight:800;font-stretch:118%;letter-spacing:-.2px;margin-bottom:3px}
.coverage .sub{display:block;font-size:12.5px;color:var(--muted)}
.coverage[open] summary{margin-bottom:14px}
.cov-bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-bottom:14px;gap:2px}
.cov-bar i{display:block;height:100%}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.svc-card{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:left;width:100%}
.svc-card[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.svc-box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;font-size:10px;color:transparent}
.svc-card[aria-pressed="true"] .svc-box{background:var(--ok);border-color:var(--ok);color:#fff}
.svc-name{font-weight:700;font-size:13px;line-height:1.2}
.svc-games{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.cov-note{margin-top:12px;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}

.tag-cov{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;font-weight:600}
.tag-cov.have{background:var(--ok-soft);color:var(--ok)}
.tag-cov.need{background:var(--warn-soft);color:var(--warn)}
.svc.unconfirmed{color:var(--warn)}
.svc.unconfirmed .pip{background:var(--warn)}
.svc.expected{border-bottom:1px dashed var(--line-strong)}
.conf-note{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conf-note.warn{color:var(--warn)}
.tbd{opacity:.75;font-style:normal}
.crest.tbd-crest{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong)}
.g-time .tbc{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:2px}

.results{margin:0 0 24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.results summary{padding:13px 16px;cursor:pointer;font-weight:800;font-stretch:112%;font-size:14px;list-style:none;display:flex;gap:10px;align-items:baseline}
.results summary::-webkit-details-marker{display:none}
.results summary::after{content:"\25BE";margin-left:auto;color:var(--muted);font-size:11px;align-self:center}
.results[open] summary{border-bottom:1px solid var(--line)}
.results[open] summary::after{content:"\25B4"}
.results-in{padding:14px 14px 2px}
.results-in .day{margin-bottom:16px}
.results-in .day:last-child{margin-bottom:6px}

const RIGHTS = [

  {comp:"NHL", when:g=>g.dow===6||g.dow===1, carriers:[tv("Sportsnet"), st("Sportsnet+")], confidence:"confirmed",

  {comp:"NFL", carriers:[tv("CTV"), tv("RDS"), st("DAZN")], confidence:"confirmed",
   note:"CTV is the free-to-air home of Sunday afternoon games; DAZN carries every game via Game Pass", src:SRC.nflca, checked:CHECKED}

function resolveRights(g){
  const ids = [g.home&&g.home.id, g.away&&g.away.id];
  const ctx = {stage:g.stage||"", has:id=>ids.indexOf(id)>=0, comp:g.comp, hour:g.slotHour||0};
  // day-of-week must be the HOME team's local day, not UTC
  ctx.dow = g.localDow;
  if(g.liveCarriers) return {carriers:g.liveCarriers, confidence:"confirmed", listed:true,
    note:"Taken from a published TV listing, not inferred", src:g.liveSrc, checked:CHECKED};
  for(const r of RIGHTS){
    if(r.comp!==g.comp) continue;
    if(r.when && !r.when(ctx)) continue;
    return r;
  }
  return {carriers:[], confidence:"unknown", note:"No rule matched", src:SRC.none};
}

// id | league | city | name | abbr | tz | colour | ucl

["tor-nhl","NHL","Toronto","Maple Leafs","TOR","ET","#00205B"],
["van-nhl","NHL","Vancouver","Canucks","VAN","PT","#00205B"],
["edm","NHL","Edmonton","Oilers","EDM","MT","#FF4C00"],

const TEAMS = {};
TEAM_ROWS.forEach(r=>{
  const t = {id:r[0], home:r[1], city:r[2], name:r[3], abbr:r[4], tz:r[5], color:r[6], ucl:!!r[7]};

const teamList = Object.values(TEAMS);

  : t.full ? t.name                       // came from the feed already complete

/* Opponents referenced by the baked fallback below. Everything else

const GHOSTS = [

const pickable = allTeams.filter(t=>!t.ghost);

/* ============================ time helpers ============================ */
const US_DST_END = Date.UTC(2026,10,1,9);
const EU_DST_END = Date.UTC(2026,9,25,1);
const US_DST_START_27 = Date.UTC(2027,2,14,7);
const EU_DST_START_27 = Date.UTC(2027,2,28,1);
function offsetFor(tz, ms){
  const us = ms < US_DST_END || ms >= US_DST_START_27;
  const eu = ms < EU_DST_END || ms >= EU_DST_START_27;
  switch(tz){
    case "ET": return us?-4:-5;  case "CT": return us?-5:-6;
    case "MT": return us?-6:-7;  case "PT": return us?-7:-8;
    case "UK": return eu?1:0;    case "CET": return eu?2:1;
    default: return 0;
  }
}
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const makeStart = (dayMs, tz, hh, mm) => dayMs + (hh-offsetFor(tz,dayMs))*3600000 + mm*60000;
const localKey = ms => ymd(new Date(ms));
const fmtTime = ms => new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(new Date(ms));
const fmtDayLong = key => { const [y,m,d]=key.split("-").map(Number); return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(new Date(y,m-1,d)); };
const fmtShortDate = ms => new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"}).format(new Date(ms));

function hash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, seed){ const a=arr.slice(), r=rng(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick = (arr,r)=>arr[Math.floor(r()*arr.length)];

/* ============================ fixtures ============================
   Every fixture on this page is a real one. There is no generator any
   more: what you see came from a published feed, and where the feed has
   nothing, the page shows nothing rather than a plausible guess.
   ================================================================== */
const DAY = 86400000;
const GAMES = [];
let gid = 0;
function addGame(o){
  o.id = o.comp+"-"+(++gid)+"-"+(o.home?o.home.id:"x")+"-"+(o.away?o.away.id:"tbd");
  o.seed = hash(o.id);
  o.stage = o.stage || "";
  GAMES.push(o);
  return o;
}
/* Two fixtures are the same game when the competition and both clubs
   match and they start within four hours of each other. Four hours, not
   the same calendar day: a baseball doubleheader is two genuinely
   different games between the same clubs on one date, and collapsing
   them would silently hide one. */
const SAME_WINDOW = 4*3600000;
function normName(x){
  return (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
/* Clubs outside the followable roster get a synthetic id, and the prefix
   depends on which path created them — the committed file, a direct
   fetch, or a remembered result. Comparing those raw made one game look
   like two. Identity is the roster id where there is one, and the club's
   name where there isn't. */
function idKey(t){
  if(!t) return "";
  return (t.id && !/^(feed|espn):/.test(t.id)) ? t.id : normName(t.name);
}
function sameGame(a, b){
  if(!a.away || !b.away || a.comp !== b.comp) return false;
  if(Math.abs(a.start - b.start) >= SAME_WINDOW) return false;
  const ah = idKey(a.home), aa = idKey(a.away), bh = idKey(b.home), ba = idKey(b.away);
  return (ah === bh && aa === ba) || (ah === ba && aa === bh);
}
function mergeReal(built){
  // Replace by identity. Without this a refresh re-added every fixture
  // it had already loaded, so a page left open during a game slowly
  // filled with duplicates of itself.
  built.forEach(g=>{
    for(let i=GAMES.length-1;i>=0;i--) if(sameGame(GAMES[i], g)) GAMES.splice(i,1);
  });
  // then retire baked fallback fixtures inside any window the feed covers
  const spans = {};
  built.forEach(g=>{
    [g.home&&g.home.id, g.away&&g.away.id].forEach(id=>{
      if(!id) return;
      const k = g.comp+"|"+id, sp = spans[k];
      spans[k] = sp ? [Math.min(sp[0],g.start), Math.max(sp[1],g.start)] : [g.start,g.start];
    });
  });
  for(let i=GAMES.length-1;i>=0;i--){
    const g = GAMES[i];
    if(g.espn) continue;
    const ids = [g.home&&g.home.id, g.away&&g.away.id];
    const hit = ids.some(id=>{
      const sp = spans[g.comp+"|"+id];
      return sp && g.start >= sp[0]-12*3600000 && g.start <= sp[1]+12*3600000;
    });
    if(hit) GAMES.splice(i,1);
  }
  built.forEach(g=>addGame(g));
  GAMES.sort((a,b)=>a.start-b.start);
}

/* ---- remembered results ------------------------------------------
   A final score, once fetched, is kept in this browser for a week. So
   a game you missed still has its score tomorrow even if the feed is
   slow, unreachable, or has moved that day out of its window. Local to
   the viewer, like every other preference here.
   ------------------------------------------------------------------ */
const RESULTS_KEY = "gdn.results";
function rememberResults(){
  try{
    const now = Date.now(), rows = [];
    GAMES.forEach(g=>{
      if(!g.away || !g.result || !g.result.score) return;
      if(g.result.status !== "final") return;
      if(g.start < now - 8*DAY || g.start > now) return;
      rows.push({c:g.comp, t:g.start, s:g.result.score, l:g.result.label,
        h:[g.home.id, fullName(g.home), g.home.abbr, g.home.color],
        a:[g.away.id, fullName(g.away), g.away.abbr, g.away.color]});
    });
    LS.set(RESULTS_KEY, rows.slice(-80));
  }catch(e){}
}
function recallResults(){
  const rows = LS.get(RESULTS_KEY, []), now = Date.now(), built = [];
  if(!rows || !rows.length) return;
  const team = (r, comp) => TEAMS[r[0]] || {id:r[0], home:comp, city:"", name:r[1],
    abbr:r[2] || "?", color:r[3] || "#5A6478", ghost:true, comps:[comp]};
  rows.forEach(r=>{
    if(!r || !r.t || r.t < now - 8*DAY) return;
    built.push({comp:r.c, home:team(r.h, r.c), away:team(r.a, r.c), start:r.t, moved:null,
      real:true, espn:true, listed:true, remembered:true,
      localDow:new Date(r.t).getUTCDay(), slotHour:new Date(r.t).getUTCHours(), stage:"",
      result:{status:"final", label:r.l || "Final", score:r.s}});
  });
  if(built.length) mergeReal(built);
}

/* ============================================================
   LIVE DATA — real fixtures and real scores from ESPN's public
   scoreboard API, called straight from the browser.

   Used for anything in progress, and as the fallback when the
   committed schedule file is missing or stale. Where nothing can be
   reached the page says so; it never invents a score.
   ============================================================ */
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/";
const ESPN_PATH = {
  NHL:"hockey/nhl", NBA:"basketball/nba", NFL:"football/nfl", MLB:"baseball/mlb",
  MLS:"soccer/usa.1", EPL:"soccer/eng.1", UCL:"soccer/uefa.champions",
  EFL:"soccer/eng.league_cup", FAC:"soccer/eng.fa",
  LALIGA:"soccer/esp.1", SERIEA:"soccer/ita.1", BUNDES:"soccer/ger.1", LIGUE1:"soccer/fra.1"
};
// clubs whose ESPN name differs from city + name
const ESPN_NAME = {
  liv:"Liverpool", ars:"Arsenal", mci:"Manchester City", mun:"Manchester United",
  che:"Chelsea", tot:"Tottenham Hotspur", new:"Newcastle United", nfo:"Nottingham Forest",
  bou:"AFC Bournemouth", ips:"Ipswich Town", avl:"Aston Villa", bha:"Brighton & Hove Albion",
  whu:"West Ham United", eve:"Everton", cry:"Crystal Palace", bre:"Brentford", ful:"Fulham",
  rma:"Real Madrid", bar:"Barcelona", bay:"Bayern Munich", psg:"Paris Saint-Germain", int:"Inter Milan",
  "van-mls":"Vancouver Whitecaps", tfc:"Toronto FC", "mtl-mls":"CF Montreal",
  lafc:"LAFC", mia:"Inter Miami CF", sou:"Seattle Sounders FC"
};
const norm = x => (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
let liveMode = null;          // null = not tried, true = reachable, false = blocked
let liveNote = "", liveErr = "";

async function jget(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms||9000);
  try{
    const res = await fetch(url, {signal:ctl.signal, mode:"cors"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function espnTeamObj(e, comp){
  if(!e) return null;
  const disp = e.displayName || e.name || "";
  for(const t of allTeams){
    if(t.home!==comp && (t.comps||[]).indexOf(comp)<0) continue;
    if(ESPN_NAME[t.id] && norm(ESPN_NAME[t.id])===norm(disp)) return t;
    if(norm(t.city+" "+t.name)===norm(disp)) return t;
    if(norm(t.name)===norm(disp)) return t;
  }
  const key = "espn:"+comp+":"+(e.id||e.abbreviation||norm(disp));
  if(!TEAMS[key]){
    TEAMS[key] = {id:key, home:comp, city:e.location||"", name:disp || e.name || "?",
      abbr:(e.abbreviation||norm(disp).slice(0,3)).toUpperCase().slice(0,4), tz:"ET",
      color:e.color?("#"+String(e.color).replace("#","")):"#5A6478", ghost:true, full:true, comps:[comp]};
    allTeams.push(TEAMS[key]);
  }
  return TEAMS[key];
}
function parseEvent(ev, comp){
  const cp = (ev.competitions && ev.competitions[0]) || ev;
  const cs = cp.competitors || [];
  const H = cs.find(c=>c.homeAway==="home") || cs[0];
  const A = cs.find(c=>c.homeAway==="away") || cs[1];
  if(!H || !A) return null;
  const home = espnTeamObj(H.team, comp), away = espnTeamObj(A.team, comp);
  if(!home || !away) return null;
  const start = Date.parse(ev.date || cp.date);
  if(!start) return null;
  const stt = (cp.status || ev.status || {});
  const ty = stt.type || {};
  const nm = ty.name || "";
  const status = /FINAL|FULL_TIME|POST/.test(nm) ? "final"
               : /IN_PROGRESS|HALFTIME|END_PERIOD|FIRST_HALF|SECOND_HALF|RAIN|DELAY/.test(nm) ? "live"
               : "scheduled";
  const num = v => { const n = parseInt(v==null?"":String(v).replace(/[^0-9-]/g,""),10); return isNaN(n)?null:n; };
  const sh = num(H.score && H.score.displayValue!=null ? H.score.displayValue : H.score);
  const sa = num(A.score && A.score.displayValue!=null ? A.score.displayValue : A.score);
  const label = ty.shortDetail || ty.description || (status==="final"?"Final":"");
  return {
    comp, home, away, start, moved:null, real:true, espn:true, listed:true,
    localDow:new Date(start).getUTCDay(), slotHour:new Date(start).getUTCHours(), stage:"",
    result: (status==="scheduled" || sh===null || sa===null)
      ? {status, label:label||"", score:null}
      : {status, label:label||(status==="final"?"Final":""), score:[sh,sa]}
  };
}
/* ---- the repo's own prebuilt fixtures ----------------------------
   A scheduled job commits data.json next to this page, so the ordinary
   visit is one request to our own domain instead of a dozen to an
   undocumented API. Live scores still come straight from the source,
   because a file refreshed every half hour cannot follow a game.
   ------------------------------------------------------------------ */
let staticAt = 0, staticCount = 0;
function staticTeam(t, comp){
  if(t.id && TEAMS[t.id]) return TEAMS[t.id];
  const key = "feed:"+comp+":"+(t.id || t.abbr || norm(t.name));
  if(!TEAMS[key]){
    TEAMS[key] = {id:key, home:comp, city:t.city || "", name:t.name || "?", abbr:(t.abbr||"?").slice(0,4),
      color:t.color || "#5A6478", ghost:true, full:true, comps:[comp]};
    allTeams.push(TEAMS[key]);
  }
  return TEAMS[key];
}
async function loadStatic(){
  let r;
  try{ r = await jget(new URL("data.json", location.href).href, 12000); }
  catch(e){ return 0; }
  if(!r || !Array.isArray(r.fixtures)) return 0;
  const built = [];
  r.fixtures.forEach(f=>{
    if(!f || !f.home || !f.away || !f.start) return;
    const home = staticTeam(f.home, f.comp), away = staticTeam(f.away, f.comp);
    if(!selected.has(home.id) && !selected.has(away.id)) return;
    built.push({comp:f.comp, home, away, start:f.start, moved:null,
      real:true, espn:true, listed:true, fromFeed:true,
      localDow:new Date(f.start).getUTCDay(), slotHour:new Date(f.start).getUTCHours(), stage:"",
      result:{status:f.status || "scheduled", label:f.label || "", score:f.score || null}});
  });
  if(built.length) mergeReal(built);
  staticAt = Date.parse(r.generated) || 0;
  staticCount = built.length;
  return built.length;
}

const espnCache = {};
async function espnTeamsList(comp){
  if(espnCache[comp]) return espnCache[comp];
  const r = await jget(ESPN+ESPN_PATH[comp]+"/teams?limit=500", 9000);
  const lg = r && r.sports && r.sports[0] && r.sports[0].leagues && r.sports[0].leagues[0];
  const list = ((lg && lg.teams) || []).map(x=>x.team).filter(Boolean);
  espnCache[comp] = list;
  return list;
}
const bare = n => norm(String(n||"").replace(/\b(fc|cf|sc|afc)\b/gi,""));
function findEspnTeam(t, list){
  const want = norm(ESPN_NAME[t.id] || (t.city+" "+t.name));
  return list.find(e=>norm(e.displayName)===want)
      || list.find(e=>bare(e.displayName)===bare(ESPN_NAME[t.id] || (t.city+" "+t.name)))
      || list.find(e=>norm(e.displayName)===norm(t.city+" "+t.name))
      || list.find(e=>norm(e.name)===norm(t.name) && norm(e.location)===norm(t.city))
      || list.find(e=>norm(e.name)===norm(t.name))
      || list.find(e=>norm(e.abbreviation)===norm(t.abbr));
}
const NA = {NHL:1, NBA:1, NFL:1, MLB:1};
const yyyymmdd = d => d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());
/* ESPN files a game under its US Eastern date — a 7:05pm EDT game is
   the 21st there and the 22nd in UTC. Ask for the wrong one and you get
   an empty day. */
/* Soccer answers a whole month at a time — YYYYMM. A YYYYMMDD-YYYYMMDD
   range looks like it works and silently returns only the first day. */
function monthKeys(a, b){
  const out = [], d = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1));
  while(d <= b && out.length < 6){
    out.push(d.getUTCFullYear()+pad(d.getUTCMonth()+1));
    d.setUTCMonth(d.getUTCMonth()+1);
  }
  return out;
}
function espnDate(ms){
  const shifted = new Date(ms + offsetFor("ET", ms)*3600000);
  return yyyymmdd(shifted);
}

/* Season schedules do not carry a reliable live score, and the scoreboard
   only answers one day at a time. So: fetch schedules for the fixtures,
   then top up scores from the scoreboard for just the handful of days
   that actually need one. */
const scoredDays = new Set();   // competition|date pairs already asked about
async function fillScores(){
  const now = Date.now();
  // newest first: if the request budget runs out it must be the oldest
  // results that wait, never tonight's game
  const need = myGames().filter(g=>
    g.away && g.start > now - 4*DAY && g.start < now + 2*3600000 &&
    !(g.result && g.result.score) && ESPN_PATH[g.comp]).sort((a,b)=>b.start-a.start);
  if(!need.length) return 0;
  const todayKey = espnDate(now);
  const days = [];
  need.forEach(g=>{
    const d = espnDate(g.start), k = g.comp+"|"+d;
    if(days.indexOf(k)>=0) return;
    // a day already tried stays skipped unless it is today, where scores move
    if(scoredDays.has(k) && d !== todayKey) return;
    if(days.length < 12) days.push(k);
  });
  if(!days.length) return 0;
  let filled = 0;
  const answered = [];
  await Promise.all(days.map(async k=>{
    const [comp, d] = k.split("|");
    let r;
    // a request that never got through stays eligible for the next cycle;
    // one that answered — even with nothing — is settled
    try{ r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+d, 9000); }catch(e){ return; }
    answered.push(k);
    (r.events||[]).forEach(ev=>{
      const parsed = parseEvent(ev, comp);
      if(!parsed || !parsed.result) return;
      const match = GAMES.find(g=>g.comp===comp && g.away &&
        Math.abs(g.start-parsed.start) < 6*3600000 &&
        ((g.home.id===parsed.home.id && g.away.id===parsed.away.id) ||
         (g.home.id===parsed.away.id && g.away.id===parsed.home.id)));
      if(!match) return;
      const flipped = match.home.id === parsed.away.id;
      const sc = parsed.result.score;
      match.result = {
        status: parsed.result.status,
        label: parsed.result.label,
        score: sc ? (flipped ? [sc[1], sc[0]] : sc) : null
      };
      match.start = parsed.start;
      match.listed = true;
      filled++;
    });
  }));
  answered.forEach(k=>scoredDays.add(k));
  if(filled) GAMES.sort((a,b)=>a.start-b.start);
  return filled;
}

async function loadLive(){
  const mine = [...selected].map(id=>TEAMS[id]).filter(Boolean);
  if(!mine.length){ return; }
  const naJobs = [], soccerComps = new Set();
  mine.forEach(t=>{
    (t.comps || [t.home]).forEach(c=>{
      if(!ESPN_PATH[c]) return;
      if(NA[c]) { if(c===t.home) naJobs.push([t,c]); }
      else soccerComps.add(c);
    });
  });
  const built = [], errs = [];
  let ok = 0;
  // Out-of-season cups and the odd bad endpoint fail routinely. Each source
  // stands or falls on its own — one failure used to take the whole feed
  // down and leave every score reading "unavailable".
  await Promise.all(naJobs.map(async ([t,comp])=>{
    try{
      const list = await espnTeamsList(comp);
      const e = findEspnTeam(t, list);
      if(!e) { errs.push(comp+": "+t.abbr+" not matched"); return; }
      const sched = await jget(ESPN+ESPN_PATH[comp]+"/teams/"+e.id+"/schedule", 12000);
      (sched.events||[]).forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
      ok++;
    }catch(err){ errs.push(comp+": "+(err && err.message || err)); }
  }));
  // The season-schedule endpoint lags and omits: it can miss a game that
  // is on tonight, and reports finished ones as 0-0 scheduled. The
  // scoreboard is authoritative for what is actually happening, so the
  // near days get fetched there as a source of fixtures in their own
  // right, not merely as a score top-up.
  const naComps = [...new Set(naJobs.map(j=>j[1]))];
  const nearDates = [-3,-2,-1,0,1].map(d=>espnDate(Date.now()+d*DAY));
  await Promise.all(naComps.map(comp=>Promise.all(nearDates.map(async d=>{
    try{
      const r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+d, 9000);
      (r.events||[]).forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
      ok++;
    }catch(err){ /* nothing that day, or out of season */ }
  }))));

  const now = new Date();
  const months = monthKeys(new Date(now.getTime()-10*DAY), new Date(now.getTime()+60*DAY));
  await Promise.all([...soccerComps].map(async comp=>{
    let got = 0, found = 0;
    const take = async m => {
      try{
        const r = await jget(ESPN+ESPN_PATH[comp]+"/scoreboard?dates="+m+"&limit=300", 12000);
        const evs = r.events || [];
        evs.forEach(ev=>{ const g = parseEvent(ev, comp); if(g) built.push(g); });
        got++; found += evs.length;
      }catch(err){ /* out of season for that month — not fatal */ }
    };
    // probe the near months first; only keep paging for a competition
    // that is actually running, so dormant cups cost two calls, not five
    await Promise.all(months.slice(0,2).map(take));
    if(found) await Promise.all(months.slice(2).map(take));
    if(got) ok++; else errs.push(comp+": no fixtures published");
  }));
  if(!ok) throw new Error(errs[0] || "no source reachable");
  // keep only fixtures that involve a team you follow
  const keep = built.filter(g=>selected.has(g.home.id) || selected.has(g.away.id));
  const dedup = [];
  keep.forEach(g=>{
    const i = dedup.findIndex(x=>sameGame(x, g));
    if(i < 0){ dedup.push(g); return; }
    const had = dedup[i].result && dedup[i].result.score;
    const better = g.result && g.result.score;
    if(better && !had) dedup[i] = g;   // the copy carrying a score wins
  });
  if(dedup.length) mergeReal(dedup);
  let filled = 0;
  try{ filled = await fillScores(); }catch(e){ errs.push("scores: "+(e && e.message || e)); }
  rememberResults();
  liveNote = dedup.length+" fixture"+(dedup.length===1?"":"s")+" from ESPN, "
    + filled+" score"+(filled===1?"":"s")+" updated"
    + (errs.length?" &middot; skipped: "+errs.slice(0,4).map(esc).join("; "):"");
}

/* ---- what's actually known yet, and when it will be ---- */
/* Kick-off times now come from the feed, so there is nothing to hedge
   about. A fixture without an opponent can still appear if a feed lists
   one that way. */
function timeState(g, now){
  if(g.away===null) return {state:"tbd", drawAt:g.drawAt};
  return {state:"set"};
}

/* ============================ live state ============================ */
const DURATION = {NHL:9300000, NBA:8400000, NFL:11400000, MLB:11100000};
const durOf = c => DURATION[c] || 6900000;

/* A game's state comes from real data or it comes from nothing.
   There is deliberately no code here that invents a score. */
function stateOf(g, now){
  if(g.away===null) return {status:"scheduled"};
  if(g.result){
    const r = g.result;
    return {status:r.status, score:r.score, label:r.label || (r.status==="final"?"Final":""), real:true};
  }
  if(now < g.start) return {status:"scheduled"};
  return now >= g.start + durOf(g.comp)
    ? {status:"final", label:"Final", score:null}
    : {status:"live", label:"In progress", score:null};
}

/* ============================ per-viewer state ============================
   Everything below lives in this browser only. Two people with the same
   link see their own teams, their own services, their own score setting.
   The link carries a starting set so a setup can move between devices.
   ========================================================================= */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULT_TEAMS = ["van-nhl","van-mls","tor-mlb","tor-nba","liv"];
let selected, services, hiddenComps, showScores;
(function initState(){
  let h = {};
  try{
    const raw = location.hash.replace(/^#/,"");
    if(raw) raw.split("&").forEach(kv=>{ const [k,v]=kv.split("="); if(k) h[k]=decodeURIComponent(v||""); });
  }catch(e){}
  const listOf = s => s ? s.split(".").filter(Boolean) : null;
  if(location.hash){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }
  selected    = new Set(listOf(h.t) || LS.get("gdn.teams", DEFAULT_TEAMS));
  services    = new Set(listOf(h.s) || LS.get("gdn.services", []));
  hiddenComps = new Set(listOf(h.x) || LS.get("gdn.hidden", []));
  showScores  = h.sc!=null ? h.sc==="1" : LS.get("gdn.scores", true);
})();
let alerts = new Set(LS.get("gdn.alerts", []));
let revealed = new Set(), view="list", calMonth=new Date(2026,7,1), selDay=null, search="";
let covOpen = null, rightsOpen = false, resultsOpen = null;   // null = open when it has results
let firstRun = !LS.get("gdn.seen", false);   // a brand-new viewer starts on the sample set   // panels keep their open/closed state across re-renders

function persist(){
  LS.set("gdn.teams",[...selected]); LS.set("gdn.services",[...services]);
  LS.set("gdn.hidden",[...hiddenComps]); LS.set("gdn.scores",showScores); LS.set("gdn.alerts",[...alerts]);
}
/* Built only when you ask for it, so the address bar stays clean. */
function shareLink(){
  try{
    const parts = ["t="+[...selected].join(".")];
    if(services.size) parts.push("s="+[...services].join("."));
    if(hiddenComps.size) parts.push("x="+[...hiddenComps].join("."));
    if(!showScores) parts.push("sc=0");
    return location.origin + location.pathname + "#" + parts.join("&");
  }catch(e){ return ""; }
}

const isMine = g => (g.home&&selected.has(g.home.id)) || (g.away&&selected.has(g.away.id));
const myGames = () => GAMES.filter(g=>isMine(g) && !hiddenComps.has(g.comp));
const myComps = () => { const s=new Set(); GAMES.forEach(g=>{ if(isMine(g)) s.add(g.comp); }); return Object.keys(COMPS).filter(c=>s.has(c)); };

/* ============================ coverage ============================ */
function servicesFor(g){
  const r = resolveRights(g);
  const ids = [];
  r.carriers.forEach(c=>{ const s = CARRIER_SERVICE[c.name]; if(s && ids.indexOf(s)<0) ids.push(s); });
  return ids;
}
const covered = g => { const ids = servicesFor(g); return ids.length ? ids.some(s=>services.has(s)) : false; };
function coverageReport(now){
  const window = myGames().filter(g=>g.start>=now && g.start<now+90*DAY);
  const need = {}, out = {total:window.length, have:0, unknown:0};
  window.forEach(g=>{
    const ids = servicesFor(g);
    if(!ids.length){ out.unknown++; return; }
    ids.forEach(s=>{ need[s]=(need[s]||0)+1; });
    if(ids.some(s=>services.has(s))) out.have++;
  });
  out.services = Object.keys(need).sort((a,b)=>need[b]-need[a]).map(id=>({id, label:SERVICES[id]?SERVICES[id].label:id, n:need[id], owned:services.has(id)}));
  out.missing = out.total - out.have - out.unknown;
  return out;
}

/* ============================ render helpers ============================ */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inkOn(hex){
  const h = hex.replace("#",""); 
  const f = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const L = 0.2126*f(parseInt(h.slice(0,2),16)) + 0.7152*f(parseInt(h.slice(2,4),16)) + 0.0722*f(parseInt(h.slice(4,6),16));
  return L > 0.45 ? "#10141F" : "#fff";
}
const crest = t => t
  ? '<span class="crest" style="background:'+t.color+';color:'+inkOn(t.color)+'">'+esc(t.abbr)+'</span>'
  : '<span class="crest tbd-crest">?</span>';
const START_VERB = {NHL:"Puck drop",NBA:"Tip-off",NFL:"Kickoff",MLB:"First pitch"};
const verbOf = c => START_VERB[c] || "Kick-off";
function countdownText(ms, now){
  let s = Math.max(0, Math.floor((ms-now)/1000));
  const d=Math.floor(s/86400); s-=d*86400;
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60); s-=m*60;
  if(d>0) return "in "+d+"d "+h+"h";
  if(h>0) return "in "+h+"h "+pad(m)+"m";
  if(m>0) return "in "+m+"m "+pad(s)+"s";
  return "starting now";
}
const BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
function orderedTeams(g){
  return SOCCER[g.comp] ? {a:g.home,b:g.away,sep:"vs",flip:false} : {a:g.away,b:g.home,sep:"at",flip:true};
}
const scoreFor = (g,s) => orderedTeams(g).flip ? [s.score[1],s.score[0]] : [s.score[0],s.score[1]];

function gameRow(g, now){
  const st = stateOf(g, now), ts = timeState(g, now), c = COMPS[g.comp];
  const o = orderedTeams(g);
  if(ts.state==="tbd"){ if(o.flip) o.a = null; else o.b = null; }
  const rights = resolveRights(g);
  const reveal = showScores || revealed.has(g.id);
  const mineA = o.a && selected.has(o.a.id), mineB = o.b && selected.has(o.b.id);

  let timeCell = '<div class="g-time">'+(ts.state==="tbd"||ts.state==="tbc" ? '<span class="tbd">'+esc(fmtTime(g.start))+'</span>' : esc(fmtTime(g.start)));
  if(g.moved) timeCell += '<span class="was">'+esc(fmtTime(g.moved))+'</span><span class="moved">Time moved</span>';
  if(ts.state==="tbc") timeCell += '<span class="tbc">Time TBC</span>';
  if(ts.state==="flex") timeCell += '<span class="tbc">Flex window</span>';
  timeCell += '</div>';

  const teams = '<div class="g-teams">'
    + '<span class="g-team'+(mineA?"":" dim")+'">'+crest(o.a)+esc(fullName(o.a))+'</span>'
    + '<span class="at">'+o.sep+'</span>'
    + '<span class="g-team'+(mineB?"":" dim")+(o.b?"":" tbd")+'">'+crest(o.b)+esc(fullName(o.b))+'</span></div>';

  const meta = '<div class="g-meta">'
    + '<span class="lg-tag" style="background:'+c.color+'">'+esc(c.short)+'</span>'
    + (g.listed?'<span class="pill confirmed" title="Real fixture from a published TV listing">Listed</span>':"")
    + (g.stage?'<span>'+esc(g.stage)+'</span>':'')
    + (g.home && g.home.city && normName(g.home.city) !== normName(g.home.name)
        ? '<span>in '+esc(g.home.city)+'</span>' : '')
    + '</div>';

  let watch;
  if(!rights.carriers.length){
    watch = '<div class="g-watch"><span class="svc unconfirmed"><span class="pip"></span>Carrier TBC</span>'
      + '<span class="conf-note warn" title="'+esc(rights.note)+'">Not confirmed in Canada</span></div>';
  } else {
    const cov = services.size ? (covered(g)
      ? '<span class="tag-cov have">You have it</span>'
      : '<span class="tag-cov need">Needs '+esc(SERVICES[servicesFor(g)[0]]?SERVICES[servicesFor(g)[0]].label:"a sub")+'</span>') : "";
    watch = '<div class="g-watch">'
      + rights.carriers.map(w=>'<span class="svc '+w.kind+(rights.confidence==="expected"?" expected":"")+'" title="'+esc(rights.note)+'"><span class="pip"></span>'+esc(w.name)+'</span>').join("")
      + (rights.confidence==="expected"?'<span class="conf-note">Expected</span>':"")
      + cov + '</div>';
  }

  let scoreCell = '<div class="g-score">';
  if(ts.state==="tbd"){
    scoreCell += '<span class="countdown">Opponent TBD</span><span class="score-state">Draw ~'+esc(fmtShortDate(g.drawAt))+'</span>';
  } else if(st.status==="scheduled"){
    scoreCell += '<span class="countdown" data-start="'+g.start+'">'+esc(countdownText(g.start,now))+'</span>'
      + '<span class="score-state">'+(ts.state==="tbc" ? "Confirmed by "+esc(fmtShortDate(ts.confirmBy)) : verbOf(g.comp))+'</span>';
  } else if(!st.score){
    scoreCell += '<span class="score-state'+(st.status==="live"?" live":"")+'">'
      + (st.status==="live"?'<span class="dot-live"></span>':"")+esc(st.label||"")+'</span>'
      + (liveMode===false
          ? '<span class="conf-note warn">Score unavailable</span>'
          : '<span class="conf-note">'+(st.status==="final"?"No score available":"No score yet")+'</span>');
  } else if(reveal){
    const sc = scoreFor(g,st);
    scoreCell += '<span class="score-line">'+sc[0]+' &ndash; '+sc[1]+'</span>'
      + (st.status==="live" ? '<span class="score-state live"><span class="dot-live"></span>'+esc(st.label)+'</span>'
                            : '<span class="score-state">'+esc(st.label)+'</span>');
  } else {
    scoreCell += '<button class="hidden-score" data-reveal="'+esc(g.id)+'">Reveal</button>'
      + (st.status==="live" ? '<span class="score-state live"><span class="dot-live"></span>Live now</span>'
                            : '<span class="score-state">'+esc(st.label||"Final")+' &middot; hidden</span>');
  }
  scoreCell += '</div>';

  const on = alerts.has(g.id);
  const bell = '<button class="bell" data-alert="'+esc(g.id)+'" aria-pressed="'+on+'" aria-label="'+(on?"Remove alert":"Set alert")+'">'+BELL+'</button>';
  return '<div class="game'+(st.status==="live"?" is-live":"")+'">'+timeCell+'<div class="g-match">'+teams+meta+'</div>'+watch+scoreCell+bell+'</div>';
}

function daySection(key, games, now, todayKey){
  const [y,m,d] = key.split("-").map(Number);
  const diff = Math.round((new Date(y,m-1,d) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/DAY);
  let rel = key===todayKey ? "Today" : diff===1 ? "Tomorrow" : (diff>1&&diff<7) ? "In "+diff+" days" : "";
  const liveN = games.filter(g=>stateOf(g,now).status==="live").length;
  return '<section class="day"><div class="day-head"><h3>'+esc(fmtDayLong(key))+'</h3>'
    + (rel?'<span class="rel">'+esc(rel)+'</span>':'')
    + '<span class="n">'+games.length+(games.length===1?" game":" games")+(liveN?" &middot; "+liveN+" live":"")+'</span></div>'
    + '<div class="day-games">'+games.map(g=>gameRow(g,now)).join("")+'</div></section>';
}
function groupByDay(games){
  const map = new Map();
  games.forEach(g=>{ const k=localKey(g.start); if(!map.has(k)) map.set(k,[]); map.get(k).push(g); });
  return map;
}

function welcomeBanner(){
  if(!firstRun) return "";
  return '<div class="welcome"><div><b>New here? These are starter teams.</b>'
    + '<p>Vancouver, Toronto and Liverpool are loaded as an example. Swap them for your own &mdash; your picks, your services and your score setting are saved in this browser only, so they will not change anyone else\'s view.</p></div>'
    + '<div class="acts"><button class="icon-btn" id="wPick">Pick my teams</button>'
    + '<button class="x" id="wClose" aria-label="Dismiss">&times;</button></div></div>';
}

/* ---------- competition filter ---------- */
function renderFilters(){
  const comps = myComps();
  if(comps.length<2) return "";
  return '<div class="filters"><span class="lbl">Competitions</span>'
    + comps.map(c=>'<button class="fchip" data-comp="'+c+'" aria-pressed="'+(!hiddenComps.has(c))+'">'
        + '<i style="background:'+COMPS[c].color+'"></i>'+esc(COMPS[c].short)+'</button>').join("")
    + '</div>';

/* ---------- coverage panel ---------- */
function renderCoverage(now){
  const rep = coverageReport(now);
  if(!rep.total) return "";
  const anySet = services.size>0;
  const pctHave = rep.total ? (rep.have/rep.total*100) : 0;
  const pctMiss = rep.total ? (rep.missing/rep.total*100) : 0;
  const pctUnk  = rep.total ? (rep.unknown/rep.total*100) : 0;
  const bar = anySet
    ? '<div class="cov-bar"><i style="width:'+pctHave+'%;background:var(--ok)"></i><i style="width:'+pctMiss+'%;background:var(--warn)"></i><i style="width:'+pctUnk+'%;background:var(--line-strong)"></i></div>'
    : "";
  const sub = anySet
    ? '<b>'+rep.have+'</b> of '+rep.total+' games in the next 90 days are covered by what you have'
      + (rep.missing?' &middot; <b>'+rep.missing+'</b> need something else':'')
      + (rep.unknown?' &middot; '+rep.unknown+' with no confirmed Canadian carrier':'')
    : 'Mark what you subscribe to and every game gets flagged as watchable or not.';
  const isOpen = covOpen===null ? !anySet : covOpen;
  return '<details class="coverage"'+(isOpen?" open":"")+'><summary><span><b class="cov-h">Where your teams actually are</b>'
    + '<span class="sub">'+sub+'</span></span></summary>' + bar
    + '<div class="svc-grid">'
    + rep.services.map(s=>'<button class="svc-card" data-service="'+s.id+'" aria-pressed="'+s.owned+'">'
        + '<span class="svc-box">&#10003;</span><span><span class="svc-name">'+esc(s.label)+'</span><br>'
        + '<span class="svc-games">'+s.n+' game'+(s.n===1?"":"s")+'</span></span></button>').join("")
    + '</div>'
    + (rep.unknown ? '<div class="cov-note"><span class="pill unknown">Unconfirmed</span><span>'+rep.unknown+' fixture'+(rep.unknown===1?" has":"s have")+' no confirmed Canadian rights holder. They stay listed rather than hidden, so you know to check.</span></div>' : "")
    + '</details>';
}

/* ---------- results that already happened ---------- */
function renderResults(now, todayKey){
  // Nothing followed yet: an empty results panel would say nothing useful,
  // and the welcome banner already explains what to do.
  if(!selected.size) return "";
  const midnight = new Date(); midnight.setHours(0,0,0,0);
  const from = midnight.getTime() - 3*DAY;   // whole calendar days, so a day never appears half-shown
  // Only real fixtures can be results.
  const past = myGames().filter(g=>g.start>=from && g.start<midnight.getTime() && (g.listed || g.espn)).sort((a,b)=>b.start-a.start);
  if(!past.length){
    return '<details class="results"'+(resultsOpen?" open":"")+'>'
      + '<summary>Recent results<span class="conf-note">last 3 days &middot; nothing confirmed</span></summary>'
      + '<div class="results-in"><div class="note">No confirmed fixtures for your teams in the last three days. '
      + 'Real fixtures appear here as soon as the feed covers them.</div></div></details>';
  }
  const scored = past.filter(g=>{ const st=stateOf(g,now); return st.score; }).length;
  const map = new Map();
  past.forEach(g=>{ const k=localKey(g.start); if(!map.has(k)) map.set(k,[]); map.get(k).push(g); });
  let inner = "";
  map.forEach((gs,k)=>{ inner += daySection(k, gs, now, todayKey); });
  return '<details class="results"'+((resultsOpen===null?true:resultsOpen)?" open":"")+'>'
    + '<summary>Recent results<span class="conf-note">last 3 days &middot; '
    + past.length+' game'+(past.length===1?"":"s")
    + (scored?' &middot; '+scored+' final score'+(scored===1?"":"s"):' &middot; no scores available')
    + '</span></summary><div class="results-in">'+inner+'</div></details>';
}

/* ---------- rights table ---------- */
function renderRights(){
  const comps = myComps();

    + '<div class="rights-wrap"><table class="rights-tbl"><thead><tr>'

    + rows.map(r=>'<tr><td><b>'+esc(COMPS[r.comp].name)+'</b></td>'

        + '<td><span class="pill '+r.confidence+'">'+r.confidence+'</span></td>'
        + '<td>'+esc(r.note)+'</td>'
        + '<td>'+(r.src&&r.src.url?'<a href="'+esc(r.src.url)+'" target="_blank" rel="noopener">'+esc(r.src.label)+'</a>':esc(r.src?r.src.label:"&mdash;"))+'</td>'
        + '<td style="white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--muted)">'+esc(r.checked||"&mdash;")+'</td></tr>').join("")

}

function noteBlock(){
  const n = alerts.size;

      ? (staticCount
          ? '<b>Live scores on.</b> Fixtures come from this site\'s own schedule file, rebuilt on a schedule; anything in progress is read live. '

function emptyState(){

function renderList(now, todayKey){
  const start = new Date(); start.setHours(0,0,0,0);
  const games = myGames().filter(g=>g.start>=start.getTime() && g.start<start.getTime()+DAY*160
    && (g.start > now - 4*3600000 || g.listed || g.espn));
  if(!games.length) return welcomeBanner()+renderFilters()+renderResults(now,todayKey)+emptyState();
  let out = welcomeBanner() + renderFilters() + renderCoverage(now) + renderResults(now, todayKey);
  groupByDay(games).forEach((gs,k)=>{ out += daySection(k, gs, now, todayKey); });
  return out + renderRights() + noteBlock();
}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function renderCalendar(now, todayKey){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const gridStart=new Date(y,m,1-new Date(y,m,1).getDay());
  const map=groupByDay(myGames());
  const present=new Set(myGames().map(g=>g.comp));
  let head='<div class="cal-head"><button class="nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>'
    + '<button class="nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button><h3>'+MONTHS[m]+' '+y+'</h3>'
    + '<div class="cal-legend">'+Object.keys(COMPS).filter(c=>present.has(c)).map(c=>'<span><i style="background:'+COMPS[c].color+'"></i>'+esc(COMPS[c].short)+'</span>').join("")+'</div></div>';
  let grid='<div class="cal-grid">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  for(let i=0;i<42;i++){
    const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i), key=ymd(d);
    const gs=map.get(key)||[], out=d.getMonth()!==m;
    let evs=gs.slice(0,3).map(g=>{
      const s=stateOf(g,now), ts=timeState(g,now);
      const mine=(g.home&&selected.has(g.home.id))?g.home:g.away;
      let opp=(mine&&g.home&&mine.id===g.home.id)?g.away:g.home;
      if(ts.state==="tbd") opp=null;
      return '<span class="cal-ev"><i style="background:'+COMPS[g.comp].color+'"></i>'+esc(mine?mine.abbr:"?")
        +'<span style="color:var(--muted)">/</span>'+esc(opp?opp.abbr:"TBD")
        +'<span class="tm">'+(s.status==="live"?"LIVE":s.status==="final"?"FT":ts.state==="tbc"||ts.state==="tbd"?"TBC":esc(fmtTime(g.start)))+'</span></span>';
    }).join("");
    if(gs.length>3) evs+='<span class="cal-more">+'+(gs.length-3)+' more</span>';
    grid+='<button class="cal-cell'+(out?" out":"")+(key===todayKey?" today":"")+(key===selDay?" sel":"")+'" data-day="'+key+'">'
      +'<span class="cal-num"><b>'+d.getDate()+'</b></span>'+evs+'</button>';
  }
  grid+='</div>';
  let detail;
  if(selDay){
    const gs=map.get(selDay)||[];
    detail='<div class="cal-detail">'+(gs.length?daySection(selDay,gs,now,todayKey)
      :'<section class="day"><div class="day-head"><h3>'+esc(fmtDayLong(selDay))+'</h3><span class="n">No games</span></div></section>')+'</div>';
  } else detail='<div class="cal-detail"><div class="note">Pick a day to see start times, scores and where each game is carried.</div></div>';
  return welcomeBanner()+renderFilters()+head+grid+detail;
}

function renderRail(now, todayKey){
  const el=document.getElementById("rail");
  const today=myGames().filter(g=>localKey(g.start)===todayKey);
  today.sort((a,b)=>{ const rk=s=>s==="live"?0:s==="scheduled"?1:2; return rk(stateOf(a,now).status)-rk(stateOf(b,now).status)||a.start-b.start; });
  const label='<div class="rail-label"><b>Today</b><span>'+esc(fmtDayLong(todayKey))+'</span></div>';
  if(!today.length){
    const next=myGames().find(g=>g.start>now);
    el.innerHTML=label+(next
      ? '<div class="rail-empty">Nothing on today. Next up: <b style="margin:0 6px">'+esc(fullName(next.home))+' '+orderedTeams(next).sep+' '+esc(fullName(next.away))+'</b> '+esc(fmtDayLong(localKey(next.start)))+' <span style="margin-left:8px;font-family:var(--mono);font-size:11px" class="countdown" data-start="'+next.start+'">'+esc(countdownText(next.start,now))+'</span></div>'
      : '<div class="rail-empty">Nothing on today.</div>');
    return;
  }
  el.innerHTML=label+'<div class="rail-scroll">'+today.map(g=>{
    const s=stateOf(g,now), o=orderedTeams(g), rights=resolveRights(g);
    const reveal=showScores||revealed.has(g.id), sc=s.score?scoreFor(g,s):null;
    const line=(t,first)=>'<div class="rail-row"><span class="t">'+esc(fullName(t))+'</span><span class="s">'
      +(s.status==="scheduled"?"&nbsp;":!sc?"&ndash;":reveal?(first?sc[0]:sc[1]):"&bull;")+'</span></div>';
    const meta=s.status==="live"?'<span class="dot-live"></span>'+esc(s.label):s.status==="final"?"Final":esc(fmtTime(g.start));
    return '<div class="rail-card">'+line(o.a,true)+line(o.b,false)
      +'<div class="rail-meta">'+meta+'<span>&middot;</span><span>'+esc(rights.carriers.length?rights.carriers[0].name:"TBC")+'</span></div></div>';
  }).join("")+'</div>';
}

function renderDrawer(){
  const q=search.trim().toLowerCase();
  const groups=Object.keys(COMPS).map(lg=>{
    const ts=pickable.filter(t=>t.home===lg && (!q||(t.city+" "+t.name+" "+t.abbr).toLowerCase().includes(q)));
    if(!ts.length) return "";
    return '<div class="lg-group"><div class="lg-title"><b>'+esc(COMPS[lg].name)+'</b><span class="bar"></span></div><div class="chips">'
      + ts.map(t=>'<button class="chip" data-team="'+t.id+'" aria-pressed="'+selected.has(t.id)+'" title="'+esc(t.comps.map(c=>COMPS[c].short).join(" · "))+'">'
          + crest(t)+esc(fullName(t))
          + (t.comps.length>1?'<span style="font-family:var(--mono);font-size:9.5px;opacity:.65">'+t.comps.length+' comps</span>':'')
          + '</button>').join("")+'</div></div>';
  }).join("");
  document.getElementById("teamGroups").innerHTML = (groups||'<div class="empty">No teams match &ldquo;'+esc(search)+'&rdquo;</div>')
    + '<div class="lg-group"><div class="lg-title"><b>Your link</b><span class="bar"></span></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + '<input class="search" id="shareBox" readonly style="margin:0;flex:1;min-width:240px" value="'+esc(shareLink())+'">'
    + '<button class="icon-btn" id="copyLink">Copy</button>'
    + '<span style="font-size:12px;color:var(--muted)">Opens with your teams already picked, then tidies itself out of their address bar. Everyone else keeps their own.</span></div></div>';
  document.getElementById("drawerCount").textContent = selected.size+" selected";
}

/* ============================ render + events ============================ */
function render(){
  const now=Date.now(), todayKey=ymd(new Date(now));
  document.getElementById("main").innerHTML = view==="list"?renderList(now,todayKey):renderCalendar(now,todayKey);
  renderRail(now,todayKey);
  document.getElementById("teamCount").textContent=selected.size;
  document.getElementById("v-list").setAttribute("aria-pressed",view==="list");
  document.getElementById("v-cal").setAttribute("aria-pressed",view==="calendar");
  const stg=document.getElementById("scoreToggle");
  stg.setAttribute("aria-pressed",showScores);
  document.getElementById("scoreToggleLabel").textContent=showScores?"Scores on":"Scores hidden";
  const cov=document.querySelector(".coverage");
  if(cov) cov.addEventListener("toggle",()=>{ covOpen=cov.open; });
  const rt=document.querySelector(".rights");
  if(rt) rt.addEventListener("toggle",()=>{ rightsOpen=rt.open; });
  const rs=document.querySelector(".results");
  if(rs) rs.addEventListener("toggle",()=>{ resultsOpen=rs.open; });
  stg.querySelector("svg").innerHTML = showScores
    ? '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.3 6.4A16.7 16.7 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
}
const drawer=document.getElementById("drawer");
document.getElementById("v-list").addEventListener("click",()=>{view="list";render();});
document.getElementById("v-cal").addEventListener("click",()=>{view="calendar"; if(!selDay) selDay=ymd(new Date()); calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1); render();});
document.getElementById("scoreToggle").addEventListener("click",()=>{showScores=!showScores; if(showScores) revealed.clear(); persist(); render();});
document.getElementById("teamsToggle").addEventListener("click",function(){
  if(firstRun){ firstRun=false; LS.set("gdn.seen",true); render(); }
  const open=drawer.hasAttribute("hidden");
  if(open){ drawer.removeAttribute("hidden"); renderDrawer(); } else drawer.setAttribute("hidden","");
  this.setAttribute("aria-pressed",open);
});
document.getElementById("teamSearch").addEventListener("input",function(){search=this.value;renderDrawer();});
document.getElementById("teamGroups").addEventListener("click",function(e){
  const b=e.target.closest("[data-team]");
  if(b){ const id=b.getAttribute("data-team"); selected.has(id)?selected.delete(id):selected.add(id);
    persist(); renderDrawer(); render(); refreshAfterPicks(); return; }
  if(e.target.closest("#copyLink")){
    const box=document.getElementById("shareBox");
    box.select();
    try{ navigator.clipboard.writeText(box.value); }catch(err){ try{ document.execCommand("copy"); }catch(e2){} }
    const btn=e.target.closest("#copyLink"); btn.textContent="Copied"; setTimeout(()=>{btn.textContent="Copy";},1400);
  }
});
document.getElementById("main").addEventListener("click",function(e){
  const rev=e.target.closest("[data-reveal]"); if(rev){ revealed.add(rev.getAttribute("data-reveal")); render(); return; }
  const al=e.target.closest("[data-alert]"); if(al){ const id=al.getAttribute("data-alert"); alerts.has(id)?alerts.delete(id):alerts.add(id); persist(); render(); return; }
  const sv=e.target.closest("[data-service]"); if(sv){ const id=sv.getAttribute("data-service"); services.has(id)?services.delete(id):services.add(id); persist(); render(); return; }
  const cp=e.target.closest("[data-comp]"); if(cp){ const id=cp.getAttribute("data-comp"); hiddenComps.has(id)?hiddenComps.delete(id):hiddenComps.add(id); persist(); render(); return; }
  const day=e.target.closest("[data-day]"); if(day){ selDay=day.getAttribute("data-day"); render(); return; }
  if(e.target.closest("#prevMonth")){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1); render(); return; }
  if(e.target.closest("#nextMonth")){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1); render(); return; }
  if(e.target.closest("#wClose")){ firstRun=false; LS.set("gdn.seen",true); render(); return; }
  if(e.target.closest("#emptyPick")||e.target.closest("#wPick")){
    firstRun=false; LS.set("gdn.seen",true);
    drawer.removeAttribute("hidden"); renderDrawer();
    document.getElementById("teamsToggle").setAttribute("aria-pressed",true);
    render();
  }
});
setInterval(()=>{ const now=Date.now(); document.querySelectorAll(".countdown[data-start]").forEach(el=>{ el.textContent=countdownText(Number(el.getAttribute("data-start")),now); }); },1000);
setInterval(render,30000);

/* Prefer the committed file; fall back to talking to the API directly
   when it is missing or has gone stale, so a stalled job degrades into
   the old behaviour rather than an empty page. */
// Generous, because the file carries fixtures rather than scores: those
// barely move, and anything in progress is topped up live regardless. A
// short window would only push every visitor back to fetching directly.
const STALE_AFTER = 12*60*60*1000;
async function refreshLive(){
  try{
    const n = await loadStatic();
    const fresh = n > 0 && staticAt && (Date.now() - staticAt) < STALE_AFTER;
    if(n > 0){ liveMode = true; liveErr = ""; rememberResults(); render(); }
    if(fresh){
      // one cheap top-up for anything in progress, then done
      let filled = 0;
      try{ filled = await fillScores(); }catch(e){}
      if(filled){ rememberResults(); }
      liveNote = staticCount + " fixture" + (staticCount===1?"":"s") + " from the schedule file"
        + (filled ? ", " + filled + " score" + (filled===1?"":"s") + " live" : "")
        + " &middot; updated " + agoText(staticAt);
      render();
      return;
    }
    await loadLive();
    liveMode = true; liveErr = ""; rememberResults(); render();
  }catch(e){
    liveMode = false;
    liveErr = (e && e.message || String(e)).slice(0,120);
    render();
  }
}
function agoText(ms){
  const m = Math.max(0, Math.round((Date.now()-ms)/60000));
  if(m < 1) return "just now";
  if(m < 60) return m + " min ago";
  const h = Math.round(m/60);
  return h + (h===1?" hour ago":" hours ago");
}
/* Picking a team should fill its fixtures in straight away rather than
   leaving a blank until the next cycle. Debounced so working through
   the picker fires one fetch, not one per click. */
let pickTimer = null;
function refreshAfterPicks(){
  clearTimeout(pickTimer);
  pickTimer = setTimeout(()=>{ if(selected.size) refreshLive(); }, 700);
}
recallResults();   // put last week's known finals on screen before any network call
refreshLive();
setInterval(()=>{
  if(liveMode===false) return;
  const now=Date.now();
  const busy = myGames().some(g=>{ const st=stateOf(g,now); return st.status==="live"; })
            || myGames().some(g=>g.start>now && g.start-now < 2*3600000);
  if(busy) refreshLive();
}, 60000);
setInterval(()=>{ if(liveMode!==false) refreshLive(); }, 15*60000);
if(!selected.size){ drawer.removeAttribute("hidden"); document.getElementById("teamsToggle").setAttribute("aria-pressed",true); }
persist(); renderDrawer(); render();
})();
</script>
